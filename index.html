<style>
:root{
  --ground:#F1F2F4; --surface:#FFFFFF; --ink:#121417; --ink2:#3A3F47; --muted:#5F6672; --faint:#8A9099;
  --line:#DEE1E6; --line2:#C9CDD4; --soft:#F6F7F8; --stage:#E3E5E9; --disabled:#A3A9B1;
  --hl:#FFD84A; --hl-soft:#FFF6D1; --ok:#1F8A5B; --bad:#B4232A;
  --sans:'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --code:'Nanum Gothic Coding', 'D2Coding', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:pan-x pan-y}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{height:100%}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
.scroll{flex:1 1 0;min-height:0;overflow:auto}
.boot{height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:18px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;flex:none}
.btn:hover:not(:disabled){border-color:var(--line2)}
.btn:disabled{color:var(--disabled);border-color:#E6E8EC;cursor:default;font-weight:500}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.hl{background:var(--hl);border-color:var(--hl)}
.btn.big{height:60px;font-size:18px;border-radius:16px}
.btn.ghost{border-style:dashed;border-width:1.5px;border-color:var(--line2);background:transparent;color:var(--ink2)}
.sq-btn{flex:none;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.sq-btn.sm{width:44px;height:44px;border-radius:12px}
.sq-btn:disabled{color:var(--disabled);cursor:default}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 위쪽 막대 (56px 한 줄) */
.topbar{flex:none;height:56px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .btn{height:44px;padding:0 14px;border-radius:12px;font-size:15px}
.topbar .sq-btn{width:44px;height:44px;border-radius:12px}
.topbar .side{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px}
.topbar .side.end{justify-content:flex-end;gap:6px;min-width:max-content}
.ptw{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pnum{flex:none;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.04em}
.ptitle{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:700;letter-spacing:-.015em}
.psub{flex:0 1000 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--muted)}
.topbar .btn.nb{min-width:64px;font-variant-numeric:tabular-nums}
.seg{flex:none;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--ground)}
.seg.white{background:var(--surface);border:1px solid var(--line)}
.seg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;min-width:128px;padding:0 22px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-size:18px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.seg-btn.sm{min-width:104px;padding:0 20px}
.topbar .seg{gap:2px;padding:3px;border-radius:13px}
.topbar .seg-btn{height:40px;min-width:92px;padding:0 16px;border-radius:10px;font-size:16px;gap:7px}
.seg-btn[aria-pressed="true"],.seg-btn[aria-current="page"]{background:var(--ink);color:#fff}

/* 수업 화면: 위 제목 줄 + 오른쪽 메뉴 */
.titlebar{flex:none;height:48px;display:flex;align-items:center;gap:12px;padding:0 20px 0 8px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.titlebar .sq-btn{width:38px;height:38px;border-radius:10px}
.titlebar .tnum{flex:none;font-family:var(--mono);font-size:28px;font-weight:600;line-height:1;letter-spacing:-.04em}
.titlebar .ttitle{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:21px;font-weight:700;letter-spacing:-.02em}
.titlebar .tsub{flex:0 1000 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-top:3px;font-size:15px;font-weight:500;color:var(--muted)}
.pas-row{flex:1 1 0;min-height:0;display:flex}
.pas-main{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.rail{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 5px 10px;background:var(--surface);border-left:1px solid var(--line);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rb.ic{min-height:40px}
.rail .grow{flex:1 1 0}
.rail .grow.lo{flex:.45 1 0}
.rb{flex:none;width:48px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 1px;border:0;border-radius:11px;background:transparent;color:var(--ink2);font-size:11px;font-weight:600;line-height:1.1;letter-spacing:-.02em;cursor:pointer;text-decoration:none;text-align:center;white-space:nowrap}
@media (hover:hover){.rb:hover:not(:disabled):not([aria-current]):not(.hl){background:var(--soft)}}
.rb:disabled{color:var(--disabled);cursor:default}
.rb.tab{min-height:52px;font-size:12px}
.rb[aria-current="page"]{background:var(--ink);color:#fff}
.rb.hl{background:var(--hl);color:var(--ink)}
.rb .nn{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);line-height:1}
.rb:disabled .nn{color:var(--disabled)}
.rail hr{flex:none;width:32px;margin:4px 0;border:0;border-top:1px solid var(--line)}
.rail-open{position:absolute;right:0;top:58%;transform:translateY(-50%);z-index:20;width:40px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:rgba(255,255,255,.96);box-shadow:0 6px 20px rgba(18,20,23,.14);color:var(--ink);font-size:11px;font-weight:600;cursor:pointer}
@media (max-height:720px){
  .titlebar{height:44px}.titlebar .tnum{font-size:24px}.titlebar .ttitle{font-size:19px}.titlebar .tsub{font-size:14px}
  .rb.tab{min-height:46px}.rb{min-height:40px;gap:2px}.rail hr{margin:2px 0}.rail .grow.lo{flex:.2 1 0}
}

/* 첫 화면 */
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--hl)}
.brand-title{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.brand-title span{box-shadow:inset 0 -.38em 0 var(--hl)}
.brand-sub{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.topbar.home-top{justify-content:space-between;padding:0 16px 0 28px}
.sync{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--ground);font-size:14px;color:var(--ink2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.err i{background:var(--bad)}
.sync.busy i{background:var(--faint)}
.home-main{width:100%;max-width:1344px;margin:0 auto;padding:36px 48px 36px;display:flex;flex-direction:column;gap:32px;min-height:100%}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
.hero h1{margin:6px 0 0;font-size:42px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.hero-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;height:60px;width:300px;max-width:100%;padding:0 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;color:var(--ink)}
.search input::placeholder{color:#6B7280}
.set{display:flex;flex-direction:column;gap:20px}
.set-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em}
.set-head .meta{font-size:15px;color:var(--muted)}
.set-head a{display:inline-flex;align-items:center;gap:6px;height:44px;font-size:15px;font-weight:500;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:16px;min-height:200px;padding:24px 26px 28px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
.card:hover{border-color:var(--line2)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-num{font-family:var(--mono);font-size:60px;font-weight:600;line-height:.9;letter-spacing:-.04em}
.chip-type{display:flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:15px;font-weight:500;color:var(--ink2);white-space:nowrap}
.card-title{flex:1;font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.015em}
.card.add{justify-content:center;gap:10px;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);cursor:default}
.card.add b{font-size:19px;font-weight:600;color:var(--ink)}
.card.add p{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 24px;text-align:center;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.empty .ic{width:68px;height:68px;border-radius:50%;background:var(--ground);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.empty b{font-size:25px;font-weight:700;letter-spacing:-.015em}
.empty p{margin:0;font-size:17px;line-height:1.65;color:var(--muted)}
.empty code{margin-top:6px;padding:10px 16px;border-radius:10px;background:var(--ground);font-family:var(--sans);font-size:15px;color:var(--ink2)}
.foot{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 48px;background:var(--surface);border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.foot strong{font-weight:600;color:var(--ink)}

/* 지문 PDF */
.stage{flex:1 1 0;min-height:0;display:flex;background:var(--stage)}
.pdf-area{position:relative;flex:1 1 0;min-width:0}
.pdf-scroll{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pdf-sheet{min-width:100%;width:max-content;min-height:100%;padding:24px 24px 40px}
.pdf-stack{margin:0 auto;width:max-content;display:flex;flex-direction:column;gap:16px;transform-origin:0 0}
.pdf-page{position:relative;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(18,20,23,.08),0 14px 36px rgba(18,20,23,.12)}
.pdf-page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:16px;right:20px;display:flex;align-items:center;gap:10px;height:42px;padding:0 18px 0 14px;border-radius:999px;background:rgba(18,20,23,.84);color:#fff;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .5s ease}
.hint.gone{opacity:0}
.dock{position:absolute;right:16px;top:58%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 4px rgba(18,20,23,.06),0 12px 30px rgba(18,20,23,.16);white-space:nowrap;transition:opacity .22s ease,transform .22s ease}
.dock.hide{opacity:0;transform:translate(12px,-50%);pointer-events:none}
.dock button{display:flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}
.dock button[aria-pressed="true"]{background:var(--hl)}
.dock .pct{width:52px;padding:6px 0;text-align:center;font-family:var(--mono);font-size:14px;font-weight:600}
.dock .sep{width:28px;height:1px;margin:4px 0;background:var(--line)}
.dock .pages{width:52px;padding:4px 0 6px;text-align:center;font-size:13px;font-weight:500;line-height:1.3;white-space:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink2);font-size:17px;text-align:center;padding:24px}
.center-msg small{color:var(--muted);font-size:14px}
.vm-bg{position:fixed;inset:0;z-index:40;display:flex;padding:20px;background:rgba(18,20,23,.55)}
.vm{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:24px;background:var(--surface);box-shadow:0 24px 64px rgba(18,20,23,.35);overflow:hidden}
.vm-head{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 10px 0 22px;border-bottom:1px solid var(--line)}
.vm-head .t{min-width:0;display:flex;align-items:center;gap:10px;white-space:nowrap}
.vm-head .t b{font-size:18px;font-weight:700}
.vm-head .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:15px;color:var(--muted)}
.vm-body{position:relative;flex:1;min-height:0}
.vm-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* 정리 */
.ex-main{width:100%;padding:32px 16px 72px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1180px) minmax(76px,1fr);column-gap:18px;align-items:start}
.ex-art{grid-column:2;min-width:0;padding:52px 60px 60px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2.8em}
.ex-art .eyebrow2{font-size:.75em;font-weight:600;color:var(--muted)}
.ex-art h1{margin:0;font-size:1.9em;font-weight:700;line-height:1.3;letter-spacing:-.025em}
.ex-sec{display:flex;flex-direction:column;gap:1em;scroll-margin-top:24px}
.ex-sec-head{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap}
.ex-sec h2{margin:0;display:flex;align-items:baseline;gap:.6em;font-size:1.25em;font-weight:700;letter-spacing:-.015em}
.ex-sec h2 span{font-family:var(--mono);font-size:.72em;font-weight:600;color:var(--muted)}
.ex-box{padding:1.1em 1.3em;border-radius:16px;background:var(--soft);font-size:1.15em;font-weight:600;line-height:1.7;letter-spacing:-.01em}
.ex-box mark{background:none;box-shadow:inset 0 -.42em 0 var(--hl);color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ex-topic{margin:0;padding:1.1em 1.3em;border-radius:16px;border:1px solid var(--line);font-size:1.2em;font-weight:500;line-height:1.6;white-space:pre-line}
.ex-flow{overflow-x:auto;padding:1.4em 1.6em;border-radius:16px;background:var(--soft);border:1px solid #E6E8EC;font-family:var(--code);font-size:.95em;line-height:1.8;white-space:pre;margin:0}
.ex-answer{display:flex;gap:1em;align-items:flex-start;padding:1.2em 1.4em;border-radius:16px;background:var(--hl)}
.ex-answer .n{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15em;font-weight:700;line-height:1}
.ex-answer .en{font-size:1.05em;font-weight:600;line-height:1.5}
.ex-answer .ko{font-size:.9em;line-height:1.6}
.ex-label{font-size:.75em;font-weight:600;color:var(--muted)}
.ex-ev{padding:1em 1.2em;border-radius:14px;background:var(--soft);font-size:.98em;font-weight:500;line-height:1.7;white-space:pre-line}
.ex-why{margin:0;font-size:.95em;line-height:1.8;color:var(--ink2);white-space:pre-line}
.ex-hidden{display:flex;flex-direction:column;align-items:center;gap:.5em;padding:2.2em 1.4em;border-radius:16px;border:1.5px dashed var(--line2);text-align:center}
.ex-hidden b{font-size:1.05em}
.ex-hidden span{font-size:.85em;color:var(--muted)}

function serializeExplain(e) {

// 퀴즈: '1. [선택] 문제', '2. [TF] [숨김] 문장' 처럼 유형과 숨김을 대괄호로 표시
const QTYPES = [
  { id: 'choice', tag: '선택', label: '선택형' },
  { id: 'tf', tag: 'TF', label: 'T / F' },
  { id: 'short', tag: '단답', label: '단답형' },
  { id: 'essay', tag: '서술', label: '서술형' },

  const grades = index.grades;
  const wanted = route.grade || local.get('grade', null);
  const grade = grades.find((g) => g.id === wanted) || grades[0] || null;
  const [q, setQ] = useState('');
  useEffect(() => { if (grade) local.set('grade', grade.id); }, [grade && grade.id]);

  const query = q.trim().toLowerCase();
  const sets = (grade ? grade.sets : []).map((s) => {
    if (!query) return s;
    const ps = s.passages.filter((p) => (p.numLabel + ' ' + p.type + ' ' + p.topic + ' ' + p.name + ' ' + s.name).toLowerCase().includes(query));
    return { ...s, passages: ps };
  }).filter((s) => !query || s.passages.length);

  const busy = sync.state === 'loading' || sync.state === 'refreshing';
  const syncText = sync.state === 'error' ? '드라이브 연결 실패' : busy ? '드라이브 확인 중…' : '드라이브와 동기화됨 · ' + ago(sync.time);

  return (
    <div className="app">
      <header className="topbar home-top">
        <div className="brand">
          <div className="brand-mark" aria-hidden="true"><Icon name="book" size={19} stroke={2.2} /></div>
          <div>
            <div className="brand-title">{CFG.TITLE.replace(/수업자료$/, '')}<span>{/수업자료$/.test(CFG.TITLE) ? '수업자료' : ''}</span></div>
            <div className="brand-sub">{CFG.SUBTITLE}</div>
          </div>
        </div>
        <div className="side end" style={{ flex: '0 1 auto' }}>
          <div className={'sync' + (sync.state === 'error' ? ' err' : busy ? ' busy' : '')} title={sync.error ? errorText(sync.error) : ''}><i aria-hidden="true" />{syncText}</div>
          <button type="button" className="sq-btn" aria-label="새로고침" onClick={onRefresh} disabled={busy}>
            <Icon name="refresh" size={22} className={busy ? 'spin' : ''} />
          </button>
          <FullscreenButton />
        </div>
      </header>

      <div className="scroll">
        <main className="home-main">
          <div className="hero">
            <div>
              <div className="eyebrow">{grade ? 'GRADE ' + ((grade.name.match(/\d+/) || [''])[0] || '') : 'MATERIALS'}</div>
              <h1>{grade ? grade.name + ' 수업자료' : '수업자료'}</h1>
            </div>
            <div className="hero-tools">
              <label className="search">
                <Icon name="search" size={20} />
                <span className="sr">지문 찾기</span>
                <input type="search" placeholder="번호나 주제로 찾기" value={q} onChange={(e) => setQ(e.target.value)} />
              </label>
              {grades.length > 0 && (
                <div className="seg white" role="group" aria-label="학년 선택">
                  {grades.map((g) => (
                    <button key={g.id} type="button" className="seg-btn sm" aria-pressed={grade && g.id === grade.id} onClick={() => { setQ(''); nav('g/' + enc(g.id), true); }}>{g.name}</button>
                  ))}
                </div>
              )}
            </div>
          </div>

          {!grade && (
            <div className="empty">
              <div className="ic"><Icon name="folder" size={30} stroke={1.8} /></div>
              <b>수업자료 폴더가 비어 있습니다</b>
              <p>드라이브의 ‘{index.rootName}’ 폴더 안에 1학년, 2학년, 3학년 폴더를 만드세요.</p>
              <code>{index.rootName} / 1학년 / 회차 폴더 / 회차 PDF + 지문 폴더</code>
            </div>
          )}

          {grade && grade.sets.length === 0 && (
            <div className="empty">
              <div className="ic"><Icon name="folder" size={30} stroke={1.8} /></div>
              <b>{grade.name} 폴더가 아직 비어 있습니다</b>
              <p>드라이브 › {index.rootName} › {grade.name} 안에 회차 폴더를 만들고,<br />그 안에 지문별 폴더를 넣으면 여기에 나타납니다.</p>
              <code>{index.rootName} / {grade.name} / 회차 폴더 / 회차 PDF + 지문 폴더</code>
            </div>
          )}

          {grade && grade.sets.length > 0 && query && sets.length === 0 && (
            <div className="empty">
              <div className="ic"><Icon name="search" size={30} stroke={1.8} /></div>
              <b>‘{q.trim()}’에 맞는 지문이 없습니다</b>
              <p>번호, 유형, 주제, 회차 이름으로 찾을 수 있습니다.</p>
            </div>
          )}

          {sets.map((s) => (
            <section className="set" key={s.id}>
              <div className="set-head">
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, flexWrap: 'wrap' }}>
                  <h2>{s.name}</h2>
                  <span className="meta">지문 {s.passages.length}{s.updated ? ' · ' + mdDate(s.updated) + ' 수정' : ''}</span>
                </div>
                <a href={'https://drive.google.com/drive/folders/' + s.id} target="_blank" rel="noopener">드라이브에서 열기<Icon name="ext" size={16} /></a>
              </div>
              <div className="grid">
                {s.passages.map((p) => <PassageCard key={p.id} p={p} />)}
                {!query && (
                  <div className="card add">
                    <Icon name="folderPlus" size={30} stroke={1.8} />
                    <b>새 지문 추가</b>
                    <p>회차 PDF는 이 회차 폴더에 한 번만 넣고, 지문 폴더는 ‘번호_주제’ 이름으로 만드세요. 유형은 번호를 보고 붙습니다.</p>
                  </div>
                )}
              </div>
            </section>
          ))}
        </main>
      </div>

      {grade && (
        <footer className="foot">
          <Icon name="folder" size={18} />
          <span>새 자료는 <strong>구글 드라이브 › {index.rootName} › {grade.name}</strong> 폴더에 넣고 새로고침을 누르면 나타납니다.</span>
        </footer>
      )}
    </div>
  );
}
function PassageCard({ p }) {
  return (
    <a className="card" href={'#/p/' + enc(p.id)}>
      <div className="card-top">
        <div className="card-num">{p.numLabel || '·'}</div>
        {p.type && <div className="chip-type">{p.type}</div>}
      </div>
      <div className="card-title">{titleOf(p)}</div>

/* ───────── 지문 화면: 위 제목 줄 + 오른쪽 메뉴 ───────── */
const TAB_DEFS = [
  { id: 'pdf', file: 'pdf', label: '지문', icon: 'file' },
  { id: 'explain', file: 'explain', label: '정리', icon: 'bulb' },
  { id: 'quiz', file: 'quiz', label: '퀴즈', icon: 'checkCircle' },
];
function Passage({ p, route }) {
  const f = p.files;
  const tabs = TAB_DEFS.filter((t) => (t.id === 'pdf' ? p.pdf : f[t.file]));
  const tab = tabs.some((t) => t.id === route.tab) ? route.tab : (tabs[0] ? tabs[0].id : '');
  const visualOpen = !!(route.visual && f.visual);
  const [railOff, setRailOff] = useState(() => local.get('railOff', false));
  useEffect(() => { local.set('railOff', railOff); }, [railOff]);

  // 이 지문 파일 미리 받아 두기, 다음 지문 PDF도 조금 뒤에
  useEffect(() => {
    [p.pdf, f.explain, f.quiz, f.visual].forEach((info) => { if (info) getFile(info).catch(() => {}); });
    const nx = p.set.passages[p.index + 1];
    const t = setTimeout(() => { if (nx && nx.pdf) getFile(nx.pdf).catch(() => {}); }, 2500);
    return () => clearTimeout(t);
  }, [p.id]);

  const prev = p.set.passages[p.index - 1];
  const next = p.set.passages[p.index + 1];
  const base = 'p/' + enc(p.id) + '/';
  const goTab = (t) => nav(base + t, true);
  const goPassage = (x) => nav('p/' + enc(x.id) + '/' + tab, true);
  const setVisual = (on) => nav(base + (tab || 'pdf') + (on ? '/visual' : ''), true);
  const label = (x) => (x.numLabel ? x.numLabel + '번' : titleOf(x).slice(0, 8));
  const short = (x) => x.numLabel || titleOf(x).slice(0, 4);

  return (
    <div className="app">
      <header className="titlebar">
        <a className="sq-btn" href={'#/g/' + enc(p.set.grade.id)} aria-label="지문 목록으로"><Icon name="back" size={21} stroke={2.2} /></a>
        <span className="tnum">{p.numLabel || '·'}</span>
        <span className="ttitle">{titleOf(p)}</span>
        <span className="tsub">{p.set.name}{p.type && p.topic ? ' · ' + p.type : ''}</span>
      </header>
      <div className="pas-row">
        <div className="pas-main">
          {tabs.length === 0 && (
            <div className="stage" style={{ background: 'var(--ground)', position: 'relative' }}>
              <Problem title="이 지문 폴더에 아직 파일이 없습니다" />
            </div>
          )}
          {tab === 'pdf' && <PdfView key={p.id} info={p.pdf} findNum={p.sharedPdf ? p.num : null} />}
          {tab === 'explain' && <ExplainView key={p.id} p={p} info={f.explain} onVisual={f.visual ? () => setVisual(true) : null} />}
          {tab === 'quiz' && <QuizView key={p.id} info={f.quiz} />}
          {railOff && (
            <button type="button" className="rail-open" aria-label="메뉴 펼치기" title="메뉴 펼치기" onClick={() => setRailOff(false)}>
              <Icon name="back" size={22} stroke={2.2} />
            </button>
          )}
        </div>
        {!railOff && (
          <nav className="rail" aria-label="수업 메뉴">
            <div className="grow" />
            {tabs.map((t) => (
              <button key={t.id} type="button" className="rb tab" aria-current={t.id === tab ? 'page' : undefined} onClick={() => goTab(t.id)}>
                <Icon name={t.icon} size={19} />{t.label}
              </button>
            ))}
            {f.visual && (
              <>
                <hr />
                <button type="button" className={'rb tab' + (visualOpen ? ' hl' : '')} aria-label="설명 자료" title="설명 자료" aria-pressed={visualOpen} onClick={() => setVisual(!visualOpen)}>
                  <Icon name="screen" size={19} />자료
                </button>
              </>
            )}
            <hr />
            <button type="button" className="rb" disabled={!prev} aria-label={prev ? '이전 지문 ' + label(prev) : '이전 지문 없음'} onClick={() => goPassage(prev)}>
              <Icon name="up" size={16} stroke={2.2} /><span className="nn">{prev ? short(prev) : ''}</span>
            </button>
            <button type="button" className="rb" disabled={!next} aria-label={next ? '다음 지문 ' + label(next) : '다음 지문 없음'} onClick={() => goPassage(next)}>
              <span className="nn">{next ? short(next) : ''}</span><Icon name="down" size={16} stroke={2.2} />
            </button>
            <div className="grow lo" />
            <button type="button" className="rb ic" aria-label="수정" title="수정" onClick={() => nav('edit/' + enc(p.id) + '/' + (tab === 'pdf' ? (f.visual ? 'visual' : 'explain') : tab), true)}><Icon name="pencil" size={20} /></button>
            <FullscreenButton rail />
            <button type="button" className="rb ic" aria-label="메뉴 접기" title="메뉴 접기" onClick={() => setRailOff(true)}><Icon name="dbl" size={20} stroke={2.2} /></button>
          </nav>
        )}
      </div>
      {visualOpen && <VisualModal p={p} info={f.visual} onClose={() => setVisual(false)} />}
    </div>
  );
}

/* ───────── PDF 보기 ───────── */
function pageSpec(name) {
  const m = String(name || '').match(/(\d+)\s*(?:[-~–]\s*(\d+))?\s*쪽/);
  if (!m) return null;
  const a = Number(m[1]), b = m[2] ? Number(m[2]) : a;
  return [Math.min(a, b), Math.max(a, b)];
}
// 회차 PDF에서 문항 번호가 시작하는 쪽 찾기 ('22.' 또는 '[41~42]')
async function findPassagePage(pages, num) {
  const head = new RegExp('^\\s*\\[?\\s*' + num + '\\s*[.~～\\]]');
  const any = new RegExp('(^|\\s|\\[)' + num + '\\s*[.~～]\\s');
  const texts = [];
  for (let i = 0; i < pages.length; i++) {
    let items = [];
    try { items = (await pages[i].pg.getTextContent()).items || []; } catch (e) {}
    if (items.some((it) => head.test(it.str || ''))) return i;
    texts.push(items.map((it) => it.str || '').join(' '));
  }
  return texts.findIndex((t) => any.test(t));
}
const ZOOMS = [50, 75, 100, 125, 150, 200, 300, 400];
const MIN_S = 0.3 * PT2PX, MAX_S = 5 * PT2PX;
const PAD = { x: 24, top: 24, bottom: 40 };

function PageCanvas({ page, w, h, scale }) {
  const ref = useRef(null);
  const drawn = useRef(false);
  const cssW = Math.round(w * scale), cssH = Math.round(h * scale);
  useEffect(() => {
    let task = null, dead = false;
    const timer = setTimeout(async () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      let rs = scale * dpr;
      const maxPx = 16e6;
      if (w * rs * h * rs > maxPx) rs = Math.sqrt(maxPx / (w * h));
      const vp = page.getViewport({ scale: rs });
      const off = document.createElement('canvas');
      off.width = Math.floor(vp.width);
      off.height = Math.floor(vp.height);
      task = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
      try { await task.promise; } catch (e) { return; }
      if (dead || !ref.current) return;
      const c = ref.current;
      c.width = off.width; c.height = off.height;
      c.getContext('2d').drawImage(off, 0, 0);
      drawn.current = true;
    }, drawn.current ? 160 : 0);
    return () => { dead = true; clearTimeout(timer); if (task) { try { task.cancel(); } catch (e) {} } };
  }, [page, scale]);
  return <div className="pdf-page" style={{ width: cssW, height: cssH }}><canvas ref={ref} /></div>;
}

function PdfView({ info, findNum }) {
  const file = useFile(info);
  const [pages, setPages] = useState(null);
  const [err, setErr] = useState(null);
  const [view, setView] = useState(() => ({ mode: local.get('pdfMode', 'width'), pct: 100 }));
  const [box, setBox] = useState({ w: 0, h: 0 });
  const [hint, setHint] = useState(() => !local.get('hintSeen', false));
  const [dock, setDock] = useState(false);
  const dockT = useRef(0), dockHold = useRef({ hover: false, focus: false });
  const scrollRef = useRef(null), stackRef = useRef(null);
  const anchorRef = useRef(null), resetRef = useRef(false);
  const [jump, setJump] = useState(-1);
  const [curPage, setCurPage] = useState(0);
  const curPageRef = useRef(0); curPageRef.current = curPage;
  const jumped = useRef(false);

  // PDF 열기
  useEffect(() => {
    if (file.status !== 'ok') return;
    let task = null, alive = true;
    (async () => {
      try {
        task = pdfjsLib.getDocument({ data: file.data.bytes.slice() });
        const doc = await task.promise;
        const ps = [];
        // 파일 이름에 '1쪽', '2-3쪽'이 있으면 그 쪽만 보여 줌
        const spec = pageSpec(info && info.name);
        const from = spec ? clamp(spec[0], 1, doc.numPages) : 1;
        const to = spec ? clamp(spec[1], from, doc.numPages) : doc.numPages;
        for (let i = from; i <= to; i++) {
          const pg = await doc.getPage(i);
          const vp = pg.getViewport({ scale: 1 });
          ps.push({ pg, n: i, w: vp.width, h: vp.height });
        }
        if (alive) setPages(ps);
        if (findNum != null && ps.length > 1) {
          const idx = await findPassagePage(ps, findNum);
          if (alive && idx > 0) setJump(idx);
        }
      } catch (e) { if (alive) setErr(e); }
    })();
    return () => { alive = false; if (task) task.destroy(); };
  }, [file.status, file.data]);

  // 화면 크기
  useLayoutEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const measure = () => setBox({ w: el.clientWidth, h: el.clientHeight });
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // 회차 PDF면 그 지문이 있는 쪽으로 처음 한 번 이동
  useLayoutEffect(() => {
    if (jump < 0 || jumped.current || !stackRef.current || !box.w) return;
    const el = stackRef.current.children[jump];
    const sc = scrollRef.current;
    if (!el || !sc) return;
    jumped.current = true;
    sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 16;
    setCurPage(jump);
  }, [jump, pages, box.w]);

  // 지금 보고 있는 쪽
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const st = stackRef.current;
        if (!st) return;
        const line = sc.getBoundingClientRect().top + sc.clientHeight * 0.35;
        let idx = 0;
        Array.from(st.children).forEach((c, i) => { if (c.getBoundingClientRect().top <= line) idx = i; });
        setCurPage(idx);
      });
    };
    sc.addEventListener('scroll', onScroll, { passive: true });
    return () => { sc.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);

  // 확대 안내는 처음 한 번만, 잠깐
  useEffect(() => {
    if (!pages || !hint) return;
    local.set('hintSeen', true);
    const t = setTimeout(() => setHint(false), 7000);
    return () => clearTimeout(t);
  }, [!!pages]);

  // 아래 확대 막대: 화면을 누르면 나오고 3초 뒤 숨음. 손가락이나 마우스가 막대 위에 있으면 그대로
  const showDock = () => {
    setDock(true);
    clearTimeout(dockT.current);
    if (!dockHold.current.hover && !dockHold.current.focus) dockT.current = setTimeout(() => setDock(false), 3000);
  };
  const dockOn = () => { clearTimeout(dockT.current); setDock(true); };
  const holdDock = (kind, on) => { dockHold.current[kind] = on; if (on) dockOn(); else showDock(); };
  useEffect(() => () => clearTimeout(dockT.current), []);


  const maxW = pages ? Math.max(...pages.map((x) => x.w)) : 595;
  const firstH = pages ? pages[0].h : 842;
  const fitW = Math.max(100, box.w - PAD.x * 2) / maxW;
  const fitP = Math.min(Math.max(100, box.h - PAD.top - PAD.bottom) / firstH, fitW);
  const scale = clamp(view.mode === 'width' ? fitW : view.mode === 'page' ? fitP : (view.pct / 100) * PT2PX, MIN_S, MAX_S);
  const pct = Math.round((scale / PT2PX) * 100);
  const scaleRef = useRef(scale); scaleRef.current = scale;
  const fitRef = useRef({ fitW, fitP }); fitRef.current = { fitW, fitP };

  const applyAnchor = () => {
    const sc = scrollRef.current, st = stackRef.current;
    if (!sc || !st) return;
    if (resetRef.current) {
      resetRef.current = false;
      st.style.transform = '';
      anchorRef.current = null;
      sc.scrollLeft = 0;
      const el = st.children[curPageRef.current] || st.children[0];
      sc.scrollTop = el ? sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 16 : 0;
      return;
    }
    const a = anchorRef.current;
    if (!a) return;
    anchorRef.current = null;
    st.style.transform = '';
    const r = st.getBoundingClientRect();
    const s = scaleRef.current;
    sc.scrollLeft += r.left + a.px * s - a.cx;
    sc.scrollTop += r.top + a.py * s - a.cy;
  };
  useLayoutEffect(applyAnchor, [scale]);

  const center = () => {
    const r = scrollRef.current.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + Math.min(r.height / 2, 320) };
  };
  const setAnchor = (cx, cy) => {
    const st = stackRef.current;
    if (!st) return;
    const r = st.getBoundingClientRect();
    const s = scaleRef.current;
    anchorRef.current = { px: (cx - r.left) / s, py: (cy - r.top) / s, cx, cy };
  };
  const commit = (next) => {
    setView(next);
    requestAnimationFrame(() => { if (anchorRef.current || resetRef.current) applyAnchor(); });
  };
  const zoomAt = (target, cx, cy) => {
    if (!stackRef.current) return;
    if (cx == null) { const c = center(); cx = c.x; cy = c.y; }
    setAnchor(cx, cy);
    commit({ mode: 'zoom', pct: Math.round((clamp(target, MIN_S, MAX_S) / PT2PX) * 100) });
    setHint(false);
  };
  const stepZoom = (dir) => {
    const next = dir > 0 ? (ZOOMS.find((l) => l > pct + 1) ?? ZOOMS[ZOOMS.length - 1]) : ([...ZOOMS].reverse().find((l) => l < pct - 1) ?? ZOOMS[0]);
    zoomAt((next / 100) * PT2PX);
  };
  const fitMode = (mode) => {
    if (!stackRef.current) return;
    if (mode === 'page') resetRef.current = true;
    else { const c = center(); setAnchor(c.x, c.y); }
    local.set('pdfMode', mode);
    commit({ mode, pct: 100 });
  };
  const doubleTap = (cx, cy) => {
    const s = scaleRef.current;
    if (s > fitRef.current.fitW * 1.15) { setAnchor(cx, cy); commit({ mode: 'width', pct: 100 }); }
    else zoomAt(s * 2, cx, cy);
  };

  // 터치: 한 손가락은 스크롤, 두 손가락은 확대·축소, 두 번 탭은 확대/원래대로
  const fns = useRef({});
  fns.current = { zoomAt, doubleTap, setAnchor, commit, showDock, dockOn };
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    let pinch = null, tap = null, lastTap = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
    const start = (e) => {
      const st = stackRef.current;
      if (e.touches.length === 2 && st) {
        e.preventDefault();
        const m = mid(e.touches);
        const r = st.getBoundingClientRect();
        const s = scaleRef.current;
        pinch = { d0: dist(e.touches), m0: m, m1: m, k: 1, s0: s, px: (m.x - r.left) / s, py: (m.y - r.top) / s, ox: m.x - r.left, oy: m.y - r.top };
        st.style.transformOrigin = pinch.ox + 'px ' + pinch.oy + 'px';
        tap = null;
        setHint(false);
        fns.current.dockOn();
      } else if (e.touches.length === 1) {
        tap = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
      } else tap = null;
    };
    const move = (e) => {
      if (pinch && e.touches.length >= 2) {
        e.preventDefault();
        const m = mid(e.touches);
        const k = clamp(pinch.s0 * (dist(e.touches) / pinch.d0), MIN_S, MAX_S) / pinch.s0;
        pinch.k = k; pinch.m1 = m;
        stackRef.current.style.transform = 'translate(' + (m.x - pinch.m0.x) + 'px,' + (m.y - pinch.m0.y) + 'px) scale(' + k + ')';
      } else if (tap && e.touches.length === 1) {
        const t = e.touches[0];
        if (Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 12) tap = null;
      }
    };
    const end = (e) => {
      if (pinch) {
        if (e.touches.length < 2) {
          const p = pinch;
          pinch = null;
          anchorRef.current = { px: p.px, py: p.py, cx: p.m1.x, cy: p.m1.y };
          fns.current.commit({ mode: 'zoom', pct: Math.round(((p.s0 * p.k) / PT2PX) * 100) });
          fns.current.showDock();
          tap = null;
          lastTap = null;
        }
        return;
      }
      if (tap && e.touches.length === 0 && Date.now() - tap.t < 300) {
        const now = Date.now();
        if (lastTap && now - lastTap.t < 340 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 40) {
          e.preventDefault();
          fns.current.doubleTap(tap.x, tap.y);
          lastTap = null;
        } else lastTap = { x: tap.x, y: tap.y, t: now };
      }
      tap = null;
    };
    const wheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      fns.current.zoomAt(scaleRef.current * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
      fns.current.showDock();
    };
    sc.addEventListener('touchstart', start, { passive: false });
    sc.addEventListener('touchmove', move, { passive: false });
    sc.addEventListener('touchend', end, { passive: false });
    sc.addEventListener('touchcancel', end, { passive: false });
    sc.addEventListener('wheel', wheel, { passive: false });
    return () => {
      sc.removeEventListener('touchstart', start);
      sc.removeEventListener('touchmove', move);
      sc.removeEventListener('touchend', end);
      sc.removeEventListener('touchcancel', end);
      sc.removeEventListener('wheel', wheel);
    };
  }, []);

  const failed = err || file.status === 'error';
  return (
    <div className="stage">
      <div className="pdf-area">
        <div className="pdf-scroll" ref={scrollRef} onClick={showDock} onDoubleClick={(e) => doubleTap(e.clientX, e.clientY)}>
          <div className="pdf-sheet">
            {pages && box.w > 0 && (
              <div className="pdf-stack" ref={stackRef}>
                {pages.map((x, i) => <PageCanvas key={i} page={x.pg} w={x.w} h={x.h} scale={scale} />)}
              </div>
            )}
          </div>
        </div>
        {!pages && !failed && <Loading text="지문을 불러오는 중" />}
        {failed && <Problem title="지문 PDF를 열지 못했습니다" error={file.error || err} onRetry={() => location.reload()} />}
        {pages && (
          <div className={'hint' + (hint ? '' : ' gone')} aria-hidden={!hint}>
            <Icon name="pinch" size={18} />두 손가락으로 확대·축소 · 두 번 탭하면 확대 · 한 번 탭하면 확대 버튼
          </div>
        )}
        {pages && (
          <div className={'dock' + (dock ? '' : ' hide')} onPointerEnter={() => holdDock('hover', true)} onPointerLeave={() => holdDock('hover', false)} onFocus={(e) => { if (e.target.matches(':focus-visible')) holdDock('focus', true); }} onBlur={() => { if (dockHold.current.focus) holdDock('focus', false); }}>
            <button type="button" aria-label="확대" onClick={() => stepZoom(1)}><Icon name="plus" size={22} stroke={2.2} /></button>
            <div className="pct" aria-live="polite">{pct}%</div>
            <button type="button" aria-label="축소" onClick={() => stepZoom(-1)}><Icon name="minus" size={22} stroke={2.2} /></button>
            <div className="sep" aria-hidden="true" />
            <button type="button" aria-label="폭 맞춤" title="폭 맞춤" aria-pressed={view.mode === 'width'} onClick={() => fitMode('width')}><Icon name="fitW" size={22} /></button>
            <button type="button" aria-label="쪽 맞춤" title="쪽 맞춤" aria-pressed={view.mode === 'page'} onClick={() => fitMode('page')}><Icon name="fitP" size={22} /></button>
            {pages.length > 1 && <><div className="sep" aria-hidden="true" /><div className="pages">{(pages[curPage] || pages[0]).n} / {pages[pages.length - 1].n}쪽</div></>}
          </div>
        )}
      </div>
    </div>
  );
}

// 설명 자료: 화면 맨 위 창. 닫기 버튼이나 Esc로만 닫힘 (바깥을 눌러도 안 닫힘)
function VisualModal({ p, info, onClose }) {
  const f = useFile(info);
  const frame = useRef(null);
  const closeRef = useRef(onClose); closeRef.current = onClose;
  const [innerClose, setInnerClose] = useState(false);
  const title = useMemo(() => {
    const m = f.data && f.data.text && f.data.text.match(/<title>([^<]*)<\/title>/i);
    const t = m ? m[1].trim() : '';
    return t && !/^설명\s*자료/.test(t) ? t : titleOf(p);
  }, [f.data]);
  useEffect(() => {
    const key = (e) => { if (e.key === 'Escape') closeRef.current(); };
    // 설명 자료 안에서 Esc를 누르면 창이 알려 줌
    const msg = (e) => {
      if (!frame.current || e.source !== frame.current.contentWindow || !e.data) return;
      if (e.data.cmv === 'close') closeRef.current();
      if (e.data.cmv === 'ready' && e.data.close) setInnerClose(true);
    };
    document.addEventListener('keydown', key);
    window.addEventListener('message', msg);
    return () => { document.removeEventListener('keydown', key); window.removeEventListener('message', msg); };
  }, []);
  return (
    <div className="vm-bg" role="dialog" aria-modal="true" aria-label="설명 자료">
      <div className="vm">
        <div className="vm-head">
          <div className="t"><Icon name="screen" size={20} /><b>설명 자료</b><span>{p.numLabel ? p.numLabel + ' · ' : ''}{title}</span></div>
          {!innerClose && <button type="button" className="sq-btn sm" aria-label="닫기" title="닫기" onClick={onClose}><Icon name="x" size={22} stroke={2.2} /></button>}
        </div>
        <div className="vm-body">
          {f.status === 'ok' && <iframe ref={frame} title="설명 자료" sandbox="allow-scripts" srcDoc={f.data.text} onLoad={(e) => { try { e.currentTarget.focus(); } catch (x) {} }} />}
          {f.status === 'loading' && <Loading text="설명 자료를 불러오는 중" />}
          {f.status === 'error' && <Problem title="설명 자료를 열지 못했습니다" error={f.error} />}
        </div>
      </div>
    </div>
  );
}

/* ───────── 정리 ───────── */
const FS = [17, 18.5, 20, 22, 24, 26, 28];
const shortOf = (t) => { const w = String(t || '').trim().split(/\s+/)[0] || ''; return w.length > 5 ? w.slice(0, 4) + '…' : w; };
function ExplainView({ p, info, onVisual }) {
  const f = useFile(info);
  const ex = useMemo(() => (f.status === 'ok' ? parseExplain(f.data.text) : null), [f.data]);
  const [fsIdx, setFsIdx] = useState(() => clamp(local.get('exFs', 2), 0, FS.length - 1));
  const [shown, setShown] = useState(true);
  const [active, setActive] = useState('');
  const scRef = useRef(null);
  useEffect(() => { local.set('exFs', fsIdx); }, [fsIdx]);

  const hasAnswer = !!ex && (ex.answerNum != null || ex.answerText || ex.ev || ex.why);
  const secs = !ex ? [] : [
    ex.summary && { id: 'sum', label: '한 줄 요약', short: '요약' },
    ex.topic && { id: 'topic', label: '주제문', short: '주제문' },
    ex.flow.trim() && { id: 'flow', label: '글의 흐름', short: '흐름' },
    hasAnswer && { id: 'answer', label: '정답과 근거', short: '정답' },
    ...ex.extras.map((x, i) => (x.title || x.body) && { id: 'x' + i, label: x.title || '추가 항목', short: shortOf(x.title || '추가') }),
  ].filter(Boolean);
  const secKey = secs.map((s) => s.id).join(',');

  // 오른쪽 막대에 지금 보는 항목 표시
  useEffect(() => {
    const sc = scRef.current;
    if (!sc || !secs.length) return;
    let raf = 0;
    const on = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const line = sc.getBoundingClientRect().top + 140;
        let cur = secs[0].id;
        secs.forEach((s) => { const el = document.getElementById('ex-' + s.id); if (el && el.getBoundingClientRect().top <= line) cur = s.id; });
        if (sc.scrollTop > 0 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) cur = secs[secs.length - 1].id;
        setActive(cur);
      });
    };
    on();
    sc.addEventListener('scroll', on, { passive: true });
    return () => { sc.removeEventListener('scroll', on); cancelAnimationFrame(raf); };
  }, [secKey]);

  if (f.status === 'loading') return <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}><Loading text="정리를 불러오는 중" /></div>;
  if (f.status === 'error' || !ex) return <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}><Problem title="정리를 열지 못했습니다" error={f.error} /></div>;

  const no = (id) => String(secs.findIndex((s) => s.id === id) + 1).padStart(2, '0');
  const jump = (id) => { const el = document.getElementById('ex-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

  return (
    <div className="scroll" ref={scRef}>
      <main className="ex-main">
        <article className="ex-art" style={{ fontSize: FS[fsIdx] }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '.8em' }}>
            <div className="eyebrow2">정리 · {p.numLabel ? p.numLabel + '번' : ''}{p.type ? ' ' + p.type : ''}</div>
            <h1>{titleOf(p)}</h1>
          </div>

          {ex.summary && (
            <section className="ex-sec" id="ex-sum">
              <h2><span>{no('sum')}</span>한 줄 요약</h2>
              <div className="ex-box"><mark>{ex.summary}</mark></div>
            </section>
          )}
          {ex.topic && (
            <section className="ex-sec" id="ex-topic">
              <h2><span>{no('topic')}</span>주제문</h2>
              <p className="ex-topic" lang="en">{ex.topic}</p>
            </section>
          )}
          {ex.flow.trim() && (
            <section className="ex-sec" id="ex-flow">
              <div className="ex-sec-head">
                <h2><span>{no('flow')}</span>글의 흐름</h2>
                {onVisual && <button type="button" className="btn hl" style={{ height: 48, borderRadius: 12 }} onClick={onVisual}><Icon name="screen" size={19} />설명 자료 보기</button>}
              </div>
              <pre className="ex-flow">{ex.flow}</pre>
            </section>
          )}
          {hasAnswer && (
            <section className="ex-sec" id="ex-answer">
              <div className="ex-sec-head">
                <h2><span>{no('answer')}</span>정답과 근거</h2>
                <button type="button" className="btn" style={{ height: 48, borderRadius: 12, borderColor: 'var(--line2)' }} aria-pressed={shown} onClick={() => setShown(!shown)}>
                  <Icon name="eye" size={18} />{shown ? '정답 가리기' : '정답 보기'}
                </button>
              </div>
              {shown ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '1.3em' }}>
                  {(ex.answerNum != null || ex.answerText) && (
                    <div className="ex-answer">
                      {ex.answerNum != null && <div className="n">{ex.answerNum + 1}</div>}
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '.25em', paddingTop: '.25em' }}>
                        {ex.answerText && <div className="en">{ex.answerText}</div>}
                        {ex.answerKo && <div className="ko">{ex.answerKo}</div>}
                      </div>
                    </div>
                  )}
                  {ex.ev && <div style={{ display: 'flex', flexDirection: 'column', gap: '.5em' }}><div className="ex-label">근거 문장</div><div className="ex-ev" lang="en">{ex.ev}</div></div>}
                  {ex.why && <div style={{ display: 'flex', flexDirection: 'column', gap: '.5em' }}><div className="ex-label">풀이</div><p className="ex-why">{ex.why}</p></div>}
                </div>
              ) : (
                <div className="ex-hidden"><b>정답이 가려져 있습니다</b><span>학생들과 먼저 풀어 본 뒤 ‘정답 보기’를 누르세요.</span></div>
              )}
            </section>
          )}
          {ex.extras.map((x, i) => (x.title || x.body) ? (
            <section className="ex-sec" id={'ex-x' + i} key={i}>
              <h2><span>{no('x' + i)}</span>{x.title || '추가 항목'}</h2>
              {x.body && <p className="ex-topic">{x.body}</p>}
            </section>
          ) : null)}
          {secs.length === 0 && <p style={{ color: 'var(--muted)' }}>정리 파일에 내용이 없습니다. 위쪽 [수정]에서 채울 수 있습니다.</p>}
        </article>

        <aside className="ex-rail" aria-label="정리 목차와 글자 크기">
          {secs.length > 1 && (
            <>
              {secs.map((s) => (
                <button key={s.id} type="button" className="sec" title={s.label} aria-label={no(s.id) + ' ' + s.label} aria-current={active === s.id ? 'true' : undefined} onClick={() => jump(s.id)}>
                  <b>{no(s.id)}</b><span>{s.short}</span>
                </button>
              ))}
              <hr />
            </>
          )}
          <button type="button" className="fsb" aria-label="글자 크게" style={{ fontSize: 19 }} disabled={fsIdx === FS.length - 1} onClick={() => setFsIdx(Math.min(FS.length - 1, fsIdx + 1))}>가+</button>
          <div className="fsv" aria-live="polite">{Math.round((FS[fsIdx] / 20) * 100)}%</div>
          <button type="button" className="fsb" aria-label="글자 작게" style={{ fontSize: 15 }} disabled={fsIdx === 0} onClick={() => setFsIdx(Math.max(0, fsIdx - 1))}>가−</button>
        </aside>
      </main>
    </div>
  );
}

/* ───────── 퀴즈 ───────── */
function QuizView({ info }) {
  const f = useFile(info);
  const all = useMemo(() => (f.status === 'ok' ? parseQuiz(f.data.text).filter((q) => q.text || q.opts.some(Boolean) || q.answer) : []), [f.data]);
  const qs = useMemo(() => all.filter((q) => !q.hidden), [all]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [hintOn, setHintOn] = useState(false);

  const center = (body) => <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}>{body}</div>;
  if (f.status === 'loading') return center(<Loading text="퀴즈를 불러오는 중" />);
  if (f.status === 'error') return center(<Problem title="퀴즈를 열지 못했습니다" error={f.error} />);
  if (!all.length) return center(<Problem title="퀴즈 문항을 읽지 못했습니다" />);
  if (!qs.length) return center(<div className="center-msg"><Icon name="eyeOff" size={30} /><b>수업에 보일 문항이 없습니다</b><small>위쪽 [수정]에서 보일 문항의 눈 아이콘을 켜 주세요.</small></div>);

  const i = Math.min(idx, qs.length - 1);
  const q = qs[i];
  const last = i === qs.length - 1;
  const go = (n) => { setIdx(n); setPicked(null); setRevealed(false); setHintOn(false); };
  const written = q.type === 'short' || q.type === 'essay';
  const rubric = String(q.rubric || '').split('\n').map((s) => s.trim()).filter(Boolean);

  return (
    <div className="scroll" style={{ display: 'flex', flexDirection: 'column' }}>
      <main className="qz-main">
        <section className="qz-left" aria-label="문제">
          <div className="qz-prog">
            <div className="l">
              <span className="qz-type">{QTYPE[q.type].label}</span>
              <span className="num">{i + 1} <span>/ {qs.length}</span></span>
            </div>
            <div className="segs" aria-hidden="true">
              {qs.map((_, k) => <i key={k} className={k < i ? 'done' : k === i ? 'cur' : ''} />)}
            </div>
          </div>
          <h1 className="qz-q">{q.text}</h1>
          {q.quote && <div className="qz-quote">{q.quote}</div>}
          {hintOn && q.hint && <div className="qz-hint"><small>힌트</small><span>{q.hint}</span></div>}

          {q.type === 'choice' && (
            <div className="opts">
              {q.opts.map((t, k) => {
                if (!t) return null;
                const isPicked = picked === k;
                const right = revealed && k === q.a;
                const wrong = revealed && isPicked && k !== q.a;
                const cls = 'opt' + (right ? ' right' : wrong ? ' wrong' : revealed ? ' dim' : isPicked ? ' picked' : '');
                return (
                  <button key={k} type="button" className={cls} aria-pressed={isPicked} onClick={() => { if (!revealed) setPicked(isPicked ? null : k); }}>
                    <span className="c">{k + 1}</span>
                    <span className="t">{t}</span>
                    {right && <span className="tag ok"><Icon name="check" size={16} stroke={2.8} />정답</span>}
                    {wrong && <span className="tag no"><Icon name="x" size={15} stroke={2.6} />선택</span>}
                  </button>

          {q.type === 'tf' && (
            <div className="tf" role="group" aria-label="맞으면 T, 틀리면 F">

          ))}
        </section>

                </div>

/* ───────── 설명 자료 고치기: 창 제목·단계 글·그림 글자 ───────── */
// 그림(.fig) 안의 글자 조각. 순서대로 번호를 매겨 고친 뒤 같은 순서로 되돌려 넣음
function figTextNodes(doc) {
  const fig = doc.querySelector('.fig');
  if (!fig) return [];
  const out = [];
  const w = doc.createTreeWalker(fig, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    if (n.parentElement && n.parentElement.closest('svg,style,script')) continue;
    out.push(n);
  }
  return out;
}
function figLabel(n) {
  const p = n.parentElement;
  if (!p) return '글자';
  if (p.closest('.lab')) return p.matches('small') ? '화살표 영어' : '화살표';
  const rules = [['.lbl', '이름'], ['.brk', '괄호'], ['.pill', '말풍선'], ['.strip', '결론'], ['.col b', '칸 제목'], ['.col p', '칸 내용'], ['.vs', 'vs'], ['.plus', '더하기'], ['.node', '원']];
  for (const [sel, name] of rules) if (p.closest(sel)) return name;
  return '글자';
}
function parseVisual(text) {
  const doc = new DOMParser().parseFromString(String(text || ''), 'text/html');
  const el = doc.getElementById('steps');
  let steps = null;
  if (el && /json/i.test(el.getAttribute('type') || '')) {
    try { const v = JSON.parse(el.textContent); if (Array.isArray(v)) steps = v.map((s) => ({ ref: '', title: '', en: '', ko: '', ...s })); } catch (e) {}
  }
  return { title: doc.title || '', steps, figs: figTextNodes(doc).map((n) => ({ label: figLabel(n), value: n.nodeValue.trim() })) };
}
function buildVisual(text, v) {
  const doc = new DOMParser().parseFromString(String(text || ''), 'text/html');
  doc.title = v.title.trim();
  figTextNodes(doc).forEach((n, i) => {
    if (!v.figs[i]) return;
    const m = n.nodeValue.match(/^(\s*)[\s\S]*?(\s*)$/);
    n.nodeValue = m[1] + v.figs[i].value + m[2];
  });
  const el = doc.getElementById('steps');
  if (el && v.steps) {
    const rows = v.steps.map((s) => '  ' + JSON.stringify({ ref: s.ref, title: s.title, en: s.en, ko: s.ko }).replace(/</g, '\\u003c'));
    el.textContent = '\n[\n' + rows.join(',\n') + '\n]\n';
  }
  return '<!doctype html>\n' + doc.documentElement.outerHTML;
}
// [[ ]] 형광펜 켜고 끄기: 칠한 곳 안을 고르면 지우고, 아니면 고른 글자를 칠함
function toggleMark(value, a, b) {
  const re = /\[\[([\s\S]+?)\]\]/g;
  let m;
  while ((m = re.exec(value))) {
    const s0 = m.index, e0 = m.index + m[0].length;
    if (a >= s0 && b <= e0) return { value: value.slice(0, s0) + m[1] + value.slice(e0), a: s0, b: s0 + m[1].length };
  }
  while (a < b && /\s/.test(value[a])) a++;
  while (b > a && /\s/.test(value[b - 1])) b--;
  if (a === b) return null;
  if (/\[\[|\]\]/.test(value.slice(a, b))) return null;
  return { value: value.slice(0, a) + '[[' + value.slice(a, b) + ']]' + value.slice(b), a: a + 2, b: b + 2 };
}
const wordCount = (s) => (String(s || '').replace(/\[\[|\]\]/g, '').match(/[A-Za-z’'-]+/g) || []).length;

// 칠판 화면 크기로 그린 뒤 줄여서 보여 주는 미리보기
const PREV_W = 1880, PREV_H = 990;
function VisualPreview({ html, step }) {
  const box = useRef(null), frame = useRef(null);
  const [w, setW] = useState(0);
  const [doc, setDoc] = useState(html);
  const stepRef = useRef(step); stepRef.current = step;
  useLayoutEffect(() => {
    const el = box.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setW(el.clientWidth));
    ro.observe(el);
    setW(el.clientWidth);
    return () => ro.disconnect();
  }, []);
  useEffect(() => { const t = setTimeout(() => setDoc(html), 450); return () => clearTimeout(t); }, [html]);
  const goStep = () => { try { frame.current.contentWindow.postMessage({ cmv: 'go', step: stepRef.current }, '*'); } catch (e) {} };
  useEffect(goStep, [step]);
  const k = w ? w / PREV_W : 0;
  return (
    <div className="vis-prev" ref={box} style={{ height: k ? Math.round(PREV_H * k) : 320 }}>
      {k > 0 && <iframe ref={frame} title="설명 자료 미리보기" sandbox="allow-scripts" srcDoc={doc} onLoad={goStep} style={{ width: PREV_W, height: PREV_H, transform: 'scale(' + k + ')' }} />}
    </div>
  );
}

              <span className="n">{k + 1}</span><span className="t">{x.title || '(제목 없음)'}</span>

          </button>
          <p className="ed-note">단계를 늘리거나 줄이면 그림이 어긋나서 여기서는 글만 고칩니다.</p>
        </div>
        <div className="vis-body">
          {!vis.steps && sel !== 'fig' && <p className="ed-note">예전 형식의 설명 자료라 단계 글은 고칠 수 없습니다. 창 제목과 그림 글자는 고칠 수 있습니다.</p>}
          {s && (
            <>
              <div className="ed-form-head"><b>{sel + 1}단계</b></div>
              <div className="vis-two">
                <label className="field"><span>지문 문장 위치</span><input className="inp" type="text" placeholder="예: 3~4번째 문장" {...field('ref')} /></label>
                <label className="field"><span>제목 <em>· 우리말</em></span><input className="inp" type="text" {...field('title')} /></label>

              <div className="field">
                <div className="ed-mark">
                  <span style={{ fontSize: 15, fontWeight: 600 }}>영어 문장 <em style={{ fontStyle: 'normal', fontWeight: 500, color: 'var(--muted)' }}>· {wordCount(s.en)}단어</em></span>
                  <button type="button" className="btn hl" style={{ height: 40, borderRadius: 10, fontSize: 14, padding: '0 14px' }} onMouseDown={(e) => e.preventDefault()} onClick={mark}>형광펜</button>
                </div>
                <textarea ref={enRef} className="inp" rows={4} lang="en" aria-label="영어 문장" {...field('en')} />
                <span className="ed-note">[[ ]] 안이 형광펜입니다. 글자를 골라 [형광펜]을 누르면 칠하고, 칠한 곳을 골라 누르면 지웁니다.</span>

          )}
          {sel === 'fig' && (
            <div className="field">
              <span>그림 글자 <em>· 길게 바꾸면 그림이 좁아질 수 있으니 미리보기로 확인하세요</em></span>
              <div className="fig-rows">
                {vis.figs.map((f, k) => (
                  <label className="fig-row" key={k}>

function Editor({ p, which, onSaved }) {
  const [pw, setPw] = useState(() => sess.get('pw'));
  const [tab, setTab] = useState(which);
  const exFile = useFile(p.files.explain);
  const qzFile = useFile(p.files.quiz);
  const visFile = useFile(p.files.visual);
  const [ex, setEx] = useState(null);
  const [qs, setQs] = useState(null);
  const [vis, setVis] = useState(null);
  const visText = useRef('');
  const [sel, setSel] = useState(0);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);
  const [leaving, setLeaving] = useState(false);
  const orig = useRef({ ex: null, qs: null, vis: null });

  useEffect(() => {
    if (ex) return;
    let e = null;
    if (!p.files.explain) e = emptyExplain();
    else if (exFile.status === 'ok') e = parseExplain(exFile.data.text);
    if (!e) return;
    e.extras = e.extras.map(withKey);
    orig.current.ex = serializeExplain(e);
    setEx(e);
  }, [exFile.status]);
  useEffect(() => {
    if (qs) return;
    let q = null;
    if (!p.files.quiz) q = [blankQuestion()];
    else if (qzFile.status === 'ok') { q = parseQuiz(qzFile.data.text); if (!q.length) q = [blankQuestion()]; }
    if (!q) return;
    q = q.map(withKey);
    orig.current.qs = serializeQuiz(q);
    setQs(q);
  }, [qzFile.status]);

  useEffect(() => {
    if (vis || !p.files.visual || visFile.status !== 'ok') return;
    visText.current = visFile.data.text;
    const v = parseVisual(visFile.data.text);
    orig.current.vis = buildVisual(visFile.data.text, v);
    setVis(v);
  }, [visFile.status]);
  const built = useMemo(() => (vis ? buildVisual(visText.current, vis) : ''), [vis]);
  const dirtyVis = !!vis && built !== orig.current.vis;

  const dirtyEx = !!ex && serializeExplain(ex) !== orig.current.ex;
  const dirtyQz = !!qs && serializeQuiz(qs) !== orig.current.qs;
  const back = () => nav('p/' + enc(p.id) + '/' + (tab === 'visual' ? 'pdf/visual' : tab), true);
  const tryLeave = () => { if (dirtyEx || dirtyQz || dirtyVis) setLeaving(true); else back(); };

  const save = async () => {
    const jobs = [];
    if (dirtyEx) jobs.push(['explain', serializeExplain(ex), 'ex']);
    if (dirtyQz) jobs.push(['quiz', serializeQuiz(qs), 'qs']);
    if (dirtyVis) jobs.push(['visual', built, 'vis']);
    if (!jobs.length) { setMsg({ kind: '', text: '바뀐 내용이 없습니다.' }); return; }
    setSaving(true); setMsg(null);
    let created = false;
    try {
      for (const [kind, content, key] of jobs) {
        const r = await apiPost({ action: 'save', password: pw, folderId: p.id, kind, content });
        if (!r.ok) throw new ApiError(r.error || 'error');

    } catch (e) {

  const qField = (k) => ({ value: q[k], onChange: (e) => setQ({ [k]: e.target.value }) });

          <button type="button" className="seg-btn" aria-pressed={tab === 'explain'} onClick={() => setTab('explain')}><Icon name="bulb" size={18} />정리{dirtyEx ? ' •' : ''}</button>
          <button type="button" className="seg-btn" aria-pressed={tab === 'quiz'} onClick={() => setTab('quiz')}><Icon name="checkCircle" size={18} />퀴즈{dirtyQz ? ' •' : ''}</button>

            <Icon name={saving ? 'refresh' : 'check'} size={18} stroke={2.4} className={saving ? 'spin' : ''} />{saving ? '저장 중…' : '저장'}

                      <input className="inp" type="text" placeholder="제목 (예: 핵심 어휘)" aria-label={(5 + k) + '번 항목 제목'} value={x.title} onChange={(e) => setX(k, { title: e.target.value })} />
                      <button type="button" className="sq-btn sm" aria-label="위로 옮기기" disabled={k === 0} onClick={() => moveX(k, k - 1)}><Icon name="up" stroke={2.2} /></button>
                      <button type="button" className="sq-btn sm" aria-label="아래로 옮기기" disabled={k === ex.extras.length - 1} onClick={() => moveX(k, k + 1)}><Icon name="down" stroke={2.2} /></button>
                      <button type="button" className="sq-btn sm" aria-label="이 항목 삭제" onClick={() => setEx({ ...ex, extras: ex.extras.filter((_, j) => j !== k) })}><Icon name="trash" size={19} /></button>
                    </div>
                    {headKey(x.title) && <div className="warn">기본 항목과 이름이 같아서 ‘{x.title.trim()} (추가)’로 저장됩니다.</div>}
                    <textarea className="inp" rows={3} placeholder="내용" aria-label={(5 + k) + '번 항목 내용'} value={x.body} onChange={(e) => setX(k, { body: e.target.value })} />
                  </div>
                ))}
                <button type="button" className="btn ghost" style={{ height: 56, borderRadius: 14 }} onClick={() => setEx({ ...ex, extras: [...ex.extras, withKey({ title: '', body: '' })] })}>
                  <Icon name="plus" size={18} stroke={2.2} />항목 추가
                </button>
              </div>
            </section>
          </main>
        )}

        {!loading && tab === 'visual' && (
          <main className="ed-main">
            {vis && <VisualEditor vis={vis} setVis={setVis} built={built} />}
            {!vis && visFile.status !== 'error' && <div style={{ position: 'relative', height: 300 }}><Loading text="설명 자료를 불러오는 중" /></div>}
            {!vis && visFile.status === 'error' && <div style={{ position: 'relative', height: 300 }}><Problem title="설명 자료를 열지 못했습니다" error={visFile.error} /></div>}
          </main>
        )}

        {!loading && tab === 'quiz' && q && (
          <main className="ed-main">
            <div className="ed-quiz">
              <div className="ed-list">
                <div className="lbl">문항 {qs.length}개 · 수업에 {shownCount}개 보임</div>
                {qs.map((x, k) => (
                  <div className="ed-row" key={x._k}>
                    <button type="button" className={'ed-item' + (x.hidden ? ' off' : '')} aria-pressed={k === si} onClick={() => setSel(k)}>
                      <span className="n">{k + 1}</span>
                      <span className="t">{x.text || '(새 문항)'}</span>
                      <span className="k">{QTYPE[x.type].label}</span>
                    </button>
                    <button type="button" className="ed-eye" aria-pressed={!x.hidden} aria-label={(k + 1) + '번 ' + (x.hidden ? '수업에 보이기' : '수업에서 숨기기')} title={x.hidden ? '숨김 · 누르면 보입니다' : '보임 · 누르면 숨깁니다'} onClick={() => toggleHide(k)}>
                      <Icon name={x.hidden ? 'eyeOff' : 'eye'} size={22} />
                    </button>
                  </div>
                ))}
                <button type="button" className="btn ghost" style={{ height: 60, borderRadius: 16 }} onClick={() => { setQs([...qs, withKey(blankQuestion())]); setSel(qs.length); }}>
                  <Icon name="plus" size={18} stroke={2.2} />문항 추가
                </button>
              </div>
              <section className="ed-form" aria-label="문항 편집">
                <div className="ed-form-head">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <b>문항 {si + 1}</b>
                    {q.hidden && <span className="badge gray"><Icon name="eyeOff" size={14} stroke={2.2} />수업에서 숨김</span>}
                  </div>
                  <div className="tools">
                    <button type="button" className="btn" style={{ height: 48, borderRadius: 12, fontSize: 15 }} onClick={() => toggleHide(si)}>
                      <Icon name={q.hidden ? 'eye' : 'eyeOff'} size={18} />{q.hidden ? '보이기' : '숨기기'}
                    </button>
                    <button type="button" className="sq-btn sm" aria-label="위로 옮기기" disabled={si === 0} onClick={() => swap(si, si - 1)}><Icon name="up" stroke={2.2} /></button>
                    <button type="button" className="sq-btn sm" aria-label="아래로 옮기기" disabled={si === qs.length - 1} onClick={() => swap(si, si + 1)}><Icon name="down" stroke={2.2} /></button>
                    <button type="button" className="btn" style={{ height: 48, borderRadius: 12, fontSize: 15, color: 'var(--ink2)' }} disabled={qs.length < 2} onClick={() => { setQs(qs.filter((_, j) => j !== si)); setSel(Math.max(0, si - 1)); }}>
                      <Icon name="trash" size={18} />삭제
                    </button>
                  </div>
                </div>
                <div className="field">
                  <span>유형</span>
                  <div className="seg white ed-type" role="group" aria-label="문항 유형" style={{ alignSelf: 'flex-start' }}>
                    {QTYPES.map((t) => <button key={t.id} type="button" className="seg-btn" aria-pressed={q.type === t.id} onClick={() => setQ({ type: t.id })}>{t.label}</button>)}
                  </div>
                </div>
                <label className="field"><span>{q.type === 'tf' ? '문장' : '문제'}{q.type === 'tf' && <em> · 맞는지 틀리는지 고를 내용</em>}</span><textarea className="inp" rows={2} {...qField('text')} /></label>
                <label className="field"><span>제시문 <em>· 없으면 비워 두세요</em></span><textarea className="inp" rows={1} placeholder="예: 밑줄 친 문장이나 빈칸 문장" {...qField('quote')} /></label>

                {q.type === 'choice' && (
                  <div className="field">
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 15, fontWeight: 600 }}>보기</span>
                      <span style={{ fontSize: 14, color: 'var(--muted)' }}>번호를 누르면 정답으로 지정됩니다</span>
                    </div>
                    {q.opts.map((o, k) => (
                      <div className="ed-opt" key={k}>
                        <button type="button" className="circ" aria-label={(k + 1) + '번을 정답으로'} aria-pressed={q.a === k} onClick={() => setQ({ a: q.a === k ? null : k })}>{k + 1}</button>
                        <input className="inp" type="text" aria-label={'보기 ' + (k + 1)} value={o} style={{ borderColor: q.a === k ? 'var(--ink)' : undefined }} onChange={(e) => setQ({ opts: q.opts.map((x, j) => (j === k ? e.target.value : x)) })} />
                        {q.a === k && <b>정답</b>}
                      </div>
                    ))}
                  </div>
                )}
                {q.type === 'tf' && (
                  <div className="field">
                    <span>정답</span>
                    <div role="group" aria-label="정답" style={{ display: 'flex', gap: 10 }}>
                      {['T', 'F'].map((v) => <button key={v} type="button" className="circ lg" aria-label={'정답 ' + v} aria-pressed={q.tf === v} onClick={() => setQ({ tf: q.tf === v ? null : v })}>{v}</button>)}
                    </div>
                  </div>
                )}
                {q.type === 'short' && (
                  <>
                    <label className="field"><span>정답 <em>· 단어나 짧은 구</em></span><input className="inp" type="text" {...qField('answer')} /></label>
                    <label className="field"><span>힌트 <em>· 없으면 비워 두세요</em></span><input className="inp" type="text" placeholder="예: c로 시작하는 9글자" {...qField('hint')} /></label>
                  </>
                )}
                {q.type === 'essay' && (
                  <>
                    <label className="field"><span>예시 답안</span><textarea className="inp" rows={3} {...qField('answer')} /></label>
                    <label className="field"><span>채점 포인트 <em>· 한 줄에 하나씩</em></span><textarea className="inp" rows={3} style={{ fontSize: 17 }} {...qField('rubric')} /></label>
                  </>
                )}
                <label className="field"><span>지문 근거</span><textarea className="inp" rows={2} lang="en" style={{ fontSize: 17 }} {...qField('ev')} /></label>
                <label className="field"><span>풀이</span><textarea className="inp" rows={2} style={{ fontSize: 17 }} {...qField('why')} /></label>
              </section>
            </div>
          </main>
        )}
      </div>

      <footer className={'ed-foot' + (msg && msg.kind ? ' ' + msg.kind : '')} role="status">
        <Icon name={msg && msg.kind === 'ok' ? 'check' : msg && msg.kind === 'bad' ? 'alert' : 'folder'} size={18} stroke={msg && msg.kind === 'ok' ? 2.6 : 2} />
        <span>{msg ? msg.text : '저장하면 드라이브의 파일이 바뀌고, 고치기 전 내용은 ‘_이전’ 폴더에 보관됩니다.'}</span>
      </footer>

      {!pw && <AuthModal onOk={(v) => { setPw(v); setMsg(null); }} onCancel={back} />}
      {leaving && <ConfirmModal text="고친 내용을 저장하지 않고 나가면 사라집니다." ok="저장하지 않고 나가기" cancel="계속 고치기" onOk={back} onCancel={() => setLeaving(false)} />}
    </div>
  );
}

/* ───────── 앱 ───────── */
function Setup() {
  return (
    <div className="scroll">
      <div className="setup">
        <h1>처음 설정이 필요합니다</h1>
        <p><code>config.js</code> 파일의 <code>API_URL</code>에 Apps Script 웹 앱 주소가 비어 있습니다.</p>
        <ol>
          <li>Apps Script에 <code>Code.gs</code>를 붙여넣고 수업자료 폴더 ID와 비밀번호를 채웁니다.</li>
          <li>배포 › 새 배포 › 웹 앱 (실행: 나, 액세스: 모든 사용자)으로 배포합니다.</li>
          <li>받은 주소(…/exec)를 <code>config.js</code>의 <code>API_URL</code>에 붙여넣고 깃허브에 올립니다.</li>
        </ol>
      </div>
    </div>
  );
}

function App() {
  const [route, setRoute] = useState(parseRoute);
  useEffect(() => {
    const f = () => setRoute(parseRoute());
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);
  const [tree, setTree] = useState(() => local.get('tree', null));
  const [sync, setSync] = useState(() => ({ state: tree ? 'stale' : 'loading', time: local.get('treeTime', 0), error: null }));
  const load = useCallback(async (fresh) => {
    setSync((s) => ({ ...s, state: s.time ? 'refreshing' : 'loading', error: null }));
    try {
      const j = await apiGet({ action: 'tree', fresh: fresh ? '1' : '' });
      const now = Date.now();
      setTree(j.tree);
      local.set('tree', j.tree);
      local.set('treeTime', now);
      setSync({ state: 'ok', time: now, error: null });
    } catch (e) {
      setSync((s) => ({ ...s, state: 'error', error: e }));
    }
  }, []);
  useEffect(() => { if (CFG.API_URL) load(false); }, []);
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick((x) => x + 1), 30000); return () => clearInterval(t); }, []);
  const index = useMemo(() => buildIndex(tree), [tree]);
  const onSaved = useCallback((pid, kind, file) => {
    setTree((t) => {
      const nt = JSON.parse(JSON.stringify(t));
      nt.grades.forEach((g) => g.sets.forEach((s) => s.passages.forEach((x) => { if (x.id === pid) x.files = { ...(x.files || {}), [kind]: file }; })));
      local.set('tree', nt);
      return nt;
    });
  }, []);

  if (!CFG.API_URL) return <Setup />;
  if (!tree) {
    if (sync.state === 'error') return <div className="app" style={{ position: 'relative' }}><Problem title="드라이브에 연결하지 못했습니다" error={sync.error} onRetry={() => load(true)} /></div>;
    return <div className="app" style={{ position: 'relative' }}><Loading text="수업자료 목록을 불러오는 중" /></div>;
  }
  if (route.view === 'passage' || route.view === 'edit') {
    const p = index.byId.get(route.id);
    if (!p) {
      if (sync.state !== 'ok' && sync.state !== 'error') return <div className="app" style={{ position: 'relative' }}><Loading text="지문을 찾는 중" /></div>;
      return (
        <div className="app" style={{ position: 'relative' }}>
          <div className="center-msg">
            <Icon name="alert" size={30} /><b>이 지문을 찾지 못했습니다</b>
            <small>드라이브에서 폴더가 옮겨졌거나 지워졌을 수 있습니다.</small>
            <a className="btn" href="#/">목록으로</a>
          </div>
        </div>
      );
    }
    if (route.view === 'edit') return <Editor key={p.id} p={p} which={route.which} onSaved={onSaved} />;
    return <Passage p={p} route={route} />;
  }
  return <Home index={index} route={route} sync={sync} onRefresh={() => load(true)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
