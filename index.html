<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠판 열기 [보문고]</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121417'/%3E%3Cpath d='M14 19c6-2.4 13-2.1 20 2.4v28c-7-4.5-14-4.8-20-2.4ZM50 19c-6-2.4-13-2.1-20 2.4v28c7-4.5 14-4.8 20-2.4Z' fill='none' stroke='%23FFD84A' stroke-width='4.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ───────────── 공통 ───────────── */
:root{
  --ground:#ECEEF1; --surface:#fff; --ink:#121417; --ink2:#3A3F47; --muted:#5F6672; --faint:#8A9099;
  --line:#E4E7EB; --line2:#CDD1D7; --soft:#F4F5F7; --hl:#FFD84A; --hl-soft:#FFF6D1; --bad:#C2333B; --ok:#1F9D6B;
  --note:#3D7BF0; --ai:#5B3CC4; --ai-soft:#EFEAFF; --sel:#2F6FE4; --sel-soft:#EAF1FD; --bk-soft:#EEF0F3; --warn:#F5A524;
  --sans:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden;letter-spacing:-.005em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.ic{display:block;flex:none}
#app{height:100%}
.row{display:flex;align-items:center}

/* ───────────── 칠판 열기 (크롬 69: flex gap·inset·clamp() 안 씀) ───────────── */
html,body{touch-action:pan-x pan-y}
body{background:#F0F1F3;overflow:auto;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
.otop{position:fixed;top:0;left:0;right:0;height:64px;z-index:5;display:flex;align-items:center;padding:0 24px 0 28px;background:#fff;border-bottom:1px solid var(--line)}
.otop .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--hl);display:flex;align-items:center;justify-content:center;flex:none;margin-right:14px}
.otop b{font-size:21px;font-weight:800;letter-spacing:-.03em;flex:none}
.otop small{font-size:14.5px;color:var(--muted);margin-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.otop .f{flex:1 1 auto}
.btn{flex:none;display:inline-flex;align-items:center;height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:16px;font-weight:700}
.btn .ic{margin-right:9px}
.omain{padding:64px 0 0;min-height:100%}
.hero{max-width:1120px;margin:0 auto;padding:12vh 32px 60px;text-align:center}
.hero h1{margin:0;font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.2}
.hero>p{margin:18px 0 0;font-size:21px;color:var(--muted);line-height:1.5}
.big{display:inline-flex;align-items:center;height:88px;padding:0 46px;margin-top:38px;border-radius:22px;background:var(--ink);color:#fff;font-size:28px;font-weight:800;letter-spacing:-.02em}
.big .ic{margin-right:14px}
.steps{display:flex;margin-top:58px;text-align:left}
.st{flex:1 1 0;min-width:0;padding:26px 24px 24px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.st+.st{margin-left:18px}
.st i{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--hl);font:700 15px/1 var(--mono);font-style:normal}
.st b{display:block;margin-top:16px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.st span{display:block;margin-top:8px;font-size:15.5px;line-height:1.55;color:var(--muted)}
.lock{display:inline-flex;align-items:center;margin-top:26px;padding:12px 20px;border-radius:14px;background:var(--hl-soft);font-size:15.5px;color:var(--ink2);text-align:left;line-height:1.5}
.lock .ic{color:#B88A00;margin-right:10px;flex:none}
.lst{max-width:1600px;margin:0 auto;padding:44px 48px 60px}
.lh{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.lh small{font-size:15px;font-weight:600;color:var(--muted)}
.lh h1{margin:6px 0 0;font-size:40px;font-weight:800;letter-spacing:-.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));grid-gap:22px}
.card{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:230px;padding:22px 26px 20px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(18,20,23,.05)}
.ct{display:flex;align-items:flex-start;justify-content:space-between}
.num{font:600 56px/1 var(--mono);letter-spacing:-.04em}
.num.sm{font-size:40px;line-height:1.15}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;margin-left:12px}
.ttl{margin-top:16px;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.sub{margin-top:8px;font-size:15.5px;color:var(--muted)}
.fn{margin-top:auto;padding-top:16px;font:500 13px var(--mono);color:var(--faint);word-break:break-all}
.oview{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:#E3E6EA}
.oview.on{display:block}
.oview iframe{display:block;width:100%;height:100%;border:0}
.otoast{display:none;position:fixed;left:50%;bottom:40px;z-index:30;transform:translateX(-50%);align-items:center;max-width:90%;padding:14px 20px;border-radius:14px;background:var(--ink);color:#fff;font-size:16px;font-weight:600}
.otoast .ic{color:var(--hl);margin-right:10px;flex:none}
.otoast.on{display:flex}
@media (max-width:900px){ .steps{display:block} .st+.st{margin:14px 0 0} .hero h1{font-size:38px} }

</style>
</head>
<body>
<header class="otop"><div class="mark" id="omark"></div><b>칠판 열기</b><small>학습지 만들기에서 저장한 수업용 파일을 여는 곳</small><span class="f"></span><button class="btn" data-o="full" id="ofull"></button></header>
<main class="omain" id="omain"></main>
<div class="oview" id="oview"></div>
<div class="otoast" id="otoast"></div>
<input type="file" id="ofile" accept=".html,.htm,text/html" multiple hidden>
<script>
/* ════════════════════════════════════════════════
   칠판 열기 — 전자칠판에서 수업용 파일을 여는 고정 페이지
   파일은 이 화면 안에서만 읽음. 어디에도 올리거나 남기지 않음 (새로 고치면 목록도 사라짐)
   전자칠판 크롬 69에서 돌게 ES5만 씀
   ════════════════════════════════════════════════ */
var OF = [];   // 이번에 연 파일 [{ name, html, info }]
var OI = -1;   // 지금 띄운 파일
var OIC = {
  book: '<path d="M3 5.5c2.6-1 5.6-.9 9 1v13c-3.4-1.9-6.4-2-9-1Z"/><path d="M21 5.5c-2.6-1-5.6-.9-9 1v13c3.4-1.9 6.4-2 9-1Z"/>',
  folder: '<path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-8l-2-3H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/>',
  full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  shrink: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  warn: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'
};
function oic(n, s, w) { return '<svg class="ic" width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + (OIC[n] || '') + '</svg>'; }
function oesc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function o$(s) { return document.querySelector(s); }
function oFullOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function oFullOk() { var d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); }
function oFull() {
  var d = document, el = d.documentElement;
  try {
    if (oFullOn()) { if (d.exitFullscreen) d.exitFullscreen(); else if (d.webkitExitFullscreen) d.webkitExitFullscreen(); }
    else if (el.requestFullscreen) { var p = el.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {}
}
function oToast(msg) {
  var t = o$('#otoast');
  t.innerHTML = msg; t.className = 'otoast on';
  clearTimeout(oToast.tm);
  oToast.tm = setTimeout(function () { t.className = 'otoast'; }, 3800);
}

/* 파일 읽기 */
function oInfo(html) {
  var m = /<script type="application\/json" id="wsb-data">([\s\S]*?)<\/script>/.exec(html);
  if (!m) return null;
  try {
    var d = JSON.parse(m[1]);
    if (!d || !d.items || !d.items.length) return null;
    var nums = d.items.map(function (x) { return x.num; }).filter(function (x) { return x; });
    return { kind: d.kind, round: d.round || '', grade: d.grade || '', n: d.items.length, nums: nums, first: d.items[0] };
  } catch (e) { return null; }
}
function oRead(file) {
  return new Promise(function (ok) {
    var r = new FileReader();
    r.onload = function () { ok({ name: file.name, html: String(r.result || '') }); };
    r.onerror = function () { ok({ name: file.name, html: '' }); };
    r.readAsText(file, 'utf-8');
  });
}
function oAdd(files) {
  files = [].slice.call(files || []);
  if (!files.length) return;
  var before = OF.length;
  Promise.all(files.map(oRead)).then(function (list) {
    var bad = [], added = 0;
    list.forEach(function (f) {
      var info = oInfo(f.html);
      if (!info) { bad.push(f.name); return; }
      var rec = { name: f.name, html: f.html, info: info }, at = -1;
      OF.forEach(function (x, i) { if (x.name === f.name) at = i; });
      if (at >= 0) OF[at] = rec; else OF.push(rec);
      added++;
    });
    if (bad.length) oToast(oic('warn', 18) + '<span>학습지 만들기의 수업용 파일이 아니에요 · ' + oesc(bad.join(', ')) + '</span>');
    if (!added) { oDraw(); return; }
    if (!before && OF.length === 1) oShow(0); else oDraw();
  });
}

/* 화면 */
function oDraw() {
  var h;
  if (!OF.length) {
    h = '<section class="hero"><h1>수업용 파일을 열어 주세요</h1>' +
      '<p>USB나 내려받은 폴더에서 수업용 파일(.html)을 고르세요. 여러 개를 한 번에 골라도 돼요.</p>' +
      '<button class="big" data-o="pick">' + oic('folder', 28, 2.2) + '파일 열기</button>' +
      '<div class="steps">' +
        '<div class="st"><i>1</i><b>PC에서 수업용 저장</b><span>학습지 만들기에서 지문 하나 또는 회차 전체를 수업용으로 저장</span></div>' +
        '<div class="st"><i>2</i><b>전자칠판으로 옮기기</b><span>USB에 담거나, 메일·메신저에서 내려받기</span></div>' +
        '<div class="st"><i>3</i><b>여기서 파일 열기</b><span>[파일 열기]로 고르면 바로 수업 화면이 떠요</span></div>' +
      '</div>' +
      '<div class="lock">' + oic('lock', 17) + '<span>파일은 이 전자칠판 안에서만 읽어요. 어디에도 올라가지 않고, 이 화면을 닫으면 남지 않아요.</span></div></section>';
  } else {
    h = '<section class="lst"><div class="lh"><div><small>이번에 연 파일</small><h1>수업용 파일 ' + OF.length + '개</h1></div>' +
      '<button class="btn" data-o="pick">' + oic('plus', 20, 2.2) + '파일 더 열기</button></div><div class="grid">' +
      OF.map(function (f, i) {
        var I = f.info, round = I.kind === 'round';
        var lo = I.nums[0] || '', hi = I.nums[I.nums.length - 1] || '';
        var num = round ? (lo && hi && lo !== hi ? lo + '~' + hi : lo) : I.first.num || '';
        var title = round ? I.round : I.first.title;
        var sub = round ? '회차 전체 · 지문 ' + I.n + '개' : [I.first.round, I.first.type].filter(function (x) { return x; }).join(' · ');
        return '<button class="card" data-o="open" data-v="' + i + '"><span class="ct"><span class="num' + (round ? ' sm' : '') + '">' + oesc(num) + '</span>' +
          (round ? '<span class="chip">회차 전체</span>' : '') + '</span><b class="ttl">' + oesc(title) + '</b><span class="sub">' + oesc(sub) + '</span><span class="fn">' + oesc(f.name) + '</span></button>';
      }).join('') + '</div><div class="lock">' + oic('lock', 17) + '<span>이 목록은 지금 화면에만 있어요. 화면을 닫거나 새로 고치면 사라지고, 전자칠판에 남지 않아요.</span></div></section>';
  }
  o$('#omain').innerHTML = h;
  o$('#ofull').innerHTML = oFullOk() ? oic(oFullOn() ? 'shrink' : 'full', 20) + (oFullOn() ? '전체 화면 끝' : '전체 화면') : '';
  o$('#ofull').style.display = oFullOk() ? '' : 'none';
}
function oShow(i) {
  var f = OF[i];
  if (!f) return;
  OI = i;
  var host = '<script>window.WSB_HOST={close:"파일 닫기"};<\/script>';
  var html = f.html.replace(/<head>/i, '<head>' + host);
  var v = o$('#oview');
  v.innerHTML = '<iframe allow="fullscreen" allowfullscreen></iframe>';
  v.className = 'oview on';
  v.firstChild.srcdoc = html;
  setTimeout(function () { try { v.firstChild.contentWindow.focus(); } catch (e) {} }, 300);
}
function oHide() {
  var v = o$('#oview');
  v.className = 'oview';
  v.innerHTML = '';
  OI = -1;
  oDraw();
}

/* 누르기 (손가락은 떼는 순간 바로) */
function oTap(t) {
  var el = t && t.closest ? t.closest('[data-o]') : null;
  if (!el) return;
  var a = el.getAttribute('data-o');
  if (a === 'pick') { var fi = o$('#ofile'); fi.value = ''; fi.click(); }
  else if (a === 'open') oShow(+el.getAttribute('data-v'));
  else if (a === 'full') oFull();
}
function oBind() {
  var TAP = null, last = 0, doc = document;
  doc.addEventListener('touchstart', function (e) { var t = e.touches[0]; TAP = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, at: Date.now(), el: e.target } : null; }, { passive: true });
  doc.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (TAP && t && (Math.abs(t.clientX - TAP.x) > 12 || Math.abs(t.clientY - TAP.y) > 12)) TAP = null; }, { passive: true });
  doc.addEventListener('touchend', function (e) {
    var tp = TAP; TAP = null;
    if (!tp || e.touches.length || Date.now() - tp.at > 700 || !tp.el.closest || !tp.el.closest('[data-o]')) return;
    if (e.cancelable) e.preventDefault();
    last = Date.now();
    oTap(tp.el);
  }, { passive: false });
  doc.addEventListener('click', function (e) { if (Date.now() - last < 600) return; oTap(e.target); });
  o$('#ofile').addEventListener('change', function () { oAdd(this.files); });
  doc.addEventListener('dragover', function (e) { e.preventDefault(); });
  doc.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files) oAdd(e.dataTransfer.files); });
  window.addEventListener('message', function (e) { if (e.data && e.data.wsb === 'close') oHide(); });
  doc.addEventListener('fullscreenchange', oDraw);
  doc.addEventListener('webkitfullscreenchange', oDraw);
  doc.addEventListener('keydown', function (e) { if (e.key === 'Escape' && OI >= 0) oHide(); });
}
function bootOpen() {
  o$('#omark').innerHTML = oic('book', 18, 2.3);
  oBind();
  oDraw();
}

bootOpen();

</script>
</body>
</html>
