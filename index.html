<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영어 수업자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{
  --ground:#F1F2F4; --surface:#FFFFFF; --ink:#121417; --ink2:#3A3F47; --muted:#5F6672; --faint:#8A9099;
  --line:#DEE1E6; --line2:#C9CDD4; --soft:#F6F7F8; --stage:#E3E5E9; --disabled:#A3A9B1;
  --hl:#FFD84A; --hl-soft:#FFF6D1; --ok:#1F8A5B; --bad:#B4232A;
  --sans:'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --code:'Nanum Gothic Coding', 'D2Coding', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{touch-action:pan-x pan-y}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{height:100%}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}
.scroll{flex:1 1 0;min-height:0;overflow:auto}
.boot{height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:18px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;flex:none}
.btn:hover:not(:disabled){border-color:var(--line2)}
.btn:disabled{color:var(--disabled);border-color:#E6E8EC;cursor:default;font-weight:500}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.hl{background:var(--hl);border-color:var(--hl)}
.btn.big{height:60px;font-size:18px;border-radius:16px}
.btn.ghost{border-style:dashed;border-width:1.5px;border-color:var(--line2);background:transparent;color:var(--ink2)}
.sq-btn{flex:none;width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.sq-btn.sm{width:48px;height:48px;border-radius:12px}
.sq-btn:disabled{color:var(--disabled);cursor:default}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 위쪽 막대 */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .side{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:16px}
.topbar .side.end{justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ptw{min-width:0;display:flex;align-items:center;gap:14px}
.pnum{font-family:var(--mono);font-size:36px;font-weight:600;line-height:1;letter-spacing:-.04em}
.pnames{min-width:0;display:flex;flex-direction:column;gap:3px}
.ptitle{font-size:18px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{flex:none;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--ground)}
.seg.white{background:var(--surface);border:1px solid var(--line)}
.seg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;min-width:128px;padding:0 22px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-size:18px;font-weight:600;cursor:pointer;text-decoration:none}
.seg-btn.sm{min-width:104px;padding:0 20px}
.seg-btn[aria-pressed="true"],.seg-btn[aria-current="page"]{background:var(--ink);color:#fff}

/* 첫 화면 */
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--hl)}
.brand-title{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-title span{box-shadow:inset 0 -.38em 0 var(--hl)}
.brand-sub{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.home-top{padding:14px 48px}
.sync{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--ground);font-size:15px;color:var(--ink2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.err i{background:var(--bad)}
.sync.busy i{background:var(--faint)}
.home-main{width:100%;max-width:1344px;margin:0 auto;padding:40px 48px 36px;display:flex;flex-direction:column;gap:32px;min-height:100%}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
.hero h1{margin:6px 0 0;font-size:42px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.hero-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;height:60px;width:300px;max-width:100%;padding:0 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;color:var(--ink)}
.search input::placeholder{color:#6B7280}
.set{display:flex;flex-direction:column;gap:20px}
.set-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em}
.set-head .meta{font-size:15px;color:var(--muted)}
.set-head a{display:inline-flex;align-items:center;gap:6px;height:44px;font-size:15px;font-weight:500;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:18px;min-height:268px;padding:26px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
.card:hover{border-color:var(--line2)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-num{font-family:var(--mono);font-size:60px;font-weight:600;line-height:.9;letter-spacing:-.04em}
.chip-type{display:flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:15px;font-weight:500;color:var(--ink2);white-space:nowrap}
.card-title{flex:1;font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.015em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:9px;background:var(--ground);font-size:14px;font-weight:500}
.chip.off{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.card.add{justify-content:center;gap:10px;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);cursor:default}
.card.add b{font-size:19px;font-weight:600;color:var(--ink)}
.card.add p{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 24px;text-align:center;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.empty .ic{width:68px;height:68px;border-radius:50%;background:var(--ground);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.empty b{font-size:25px;font-weight:700;letter-spacing:-.015em}
.empty p{margin:0;font-size:17px;line-height:1.65;color:var(--muted)}
.empty code{margin-top:6px;padding:10px 16px;border-radius:10px;background:var(--ground);font-family:var(--mono),var(--sans);font-size:15px;color:var(--ink2)}
.foot{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 48px;background:var(--surface);border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.foot strong{font-weight:600;color:var(--ink)}

/* 지문 PDF */
.stage{flex:1 1 0;min-height:0;display:flex;background:var(--stage)}
.pdf-area{position:relative;flex:1 1 0;min-width:0}
.pdf-area.with-panel{flex:0 0 36%}
.pdf-scroll{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pdf-sheet{min-width:100%;width:max-content;min-height:100%;padding:32px 32px 132px}
.pdf-stack{margin:0 auto;width:max-content;display:flex;flex-direction:column;gap:16px;transform-origin:0 0}
.pdf-page{position:relative;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 2px rgba(18,20,23,.08),0 14px 36px rgba(18,20,23,.12)}
.pdf-page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:20px;right:24px;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;border-radius:999px;background:rgba(18,20,23,.84);color:#fff;font-size:15px;pointer-events:none;transition:opacity .5s ease}
.hint.gone{opacity:0}
.dock{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 4px rgba(18,20,23,.06),0 14px 36px rgba(18,20,23,.16);white-space:nowrap}
.dock button{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;min-width:56px;padding:0;border:0;border-radius:16px;background:transparent;color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}
.dock button.wide{padding:0 18px}
.dock button[aria-pressed="true"]{background:var(--hl)}
.dock .pct{min-width:70px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:600}
.dock .sep{width:1px;height:32px;margin:0 4px;background:var(--line)}
.dock .pages{padding:0 14px 0 8px;font-family:var(--mono);font-size:16px;font-weight:500;color:var(--muted)}
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink2);font-size:17px;text-align:center;padding:24px}
.center-msg small{color:var(--muted);font-size:14px}
.visual-panel{position:relative;flex:1 1 0;min-width:0;background:var(--surface);border-left:1px solid var(--line)}
.visual-panel iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.panel-close{position:absolute;top:30px;right:28px;z-index:2}

/* 해설 */
.ex-main{width:100%;max-width:1280px;margin:0 auto;padding:40px 40px 72px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}
.ex-art{flex:999 1 640px;min-width:0;padding:56px 64px 64px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2.8em}
.ex-art .eyebrow2{font-family:var(--mono),var(--sans);font-size:.7em;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.ex-art h1{margin:0;font-size:1.9em;font-weight:700;line-height:1.3;letter-spacing:-.025em}
.ex-sec{display:flex;flex-direction:column;gap:1em;scroll-margin-top:24px}
.ex-sec-head{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap}
.ex-sec h2{margin:0;display:flex;align-items:baseline;gap:.6em;font-size:1.25em;font-weight:700;letter-spacing:-.015em}
.ex-sec h2 span{font-family:var(--mono);font-size:.72em;font-weight:600;color:var(--muted)}
.ex-box{padding:1.1em 1.3em;border-radius:16px;background:var(--soft);font-size:1.15em;font-weight:600;line-height:1.7;letter-spacing:-.01em}
.ex-box mark{background:none;box-shadow:inset 0 -.42em 0 var(--hl);color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ex-topic{margin:0;padding:1.1em 1.3em;border-radius:16px;border:1px solid var(--line);font-size:1.2em;font-weight:500;line-height:1.6}
.ex-flow{overflow-x:auto;padding:1.4em 1.6em;border-radius:16px;background:var(--soft);border:1px solid #E6E8EC;font-family:var(--code);font-size:.95em;line-height:1.8;white-space:pre;margin:0}
.ex-answer{display:flex;gap:1.1em;align-items:flex-start;padding:1.2em 1.4em;border-radius:16px;background:var(--hl)}
.ex-answer .n{flex:none;font-family:var(--mono),var(--sans);font-size:1.6em;font-weight:600;line-height:1.15}
.ex-answer .en{font-size:1.05em;font-weight:600;line-height:1.5}
.ex-answer .ko{font-size:.9em;line-height:1.6}
.ex-label{font-size:.75em;font-weight:600;color:var(--muted)}
.ex-ev{padding:1em 1.2em;border-radius:14px;background:var(--soft);font-size:.98em;font-weight:500;line-height:1.7;white-space:pre-line}
.ex-why{margin:0;font-size:.95em;line-height:1.8;color:var(--ink2);white-space:pre-line}
.ex-hidden{display:flex;flex-direction:column;align-items:center;gap:.5em;padding:2.2em 1.4em;border-radius:16px;border:1.5px dashed var(--line2);text-align:center}
.ex-hidden b{font-size:1.05em}
.ex-hidden span{font-size:.85em;color:var(--muted)}
.ex-side{flex:1 1 240px;display:flex;flex-direction:column;gap:16px}
.box{padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.box-label{padding:8px 12px 10px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.toc button{width:100%;display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border:0;border-radius:12px;background:transparent;font-size:16px;font-weight:500;text-align:left;cursor:pointer}
.toc button:hover{background:var(--ground)}
.toc span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.fs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 12px}
.fs button{width:60px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.fs .v{font-family:var(--mono);font-size:18px;font-weight:600}

/* 형성평가 */
.qz-main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:32px 40px;display:flex;flex-wrap:wrap;align-items:stretch;gap:28px}
.qz-left{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:24px}
.qz-prog{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qz-prog .lbl{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.qz-prog .num{font-family:var(--mono);font-size:22px;font-weight:600}
.qz-prog .num span{color:var(--muted)}
.segs{display:flex;gap:6px;width:260px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.segs i.done{background:var(--ink)}
.segs i.cur{background:var(--hl)}
.qz-q{margin:0;font-size:31px;font-weight:700;line-height:1.45;letter-spacing:-.02em}
.qz-quote{padding:16px 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:500;line-height:1.6;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:18px;min-height:66px;padding:10px 22px 10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;font-weight:500;line-height:1.45;text-align:left;cursor:pointer}
.opt .c{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ground);font-family:var(--mono),var(--sans);font-size:18px;font-weight:600}
.opt .t{flex:1}
.opt.picked{border-color:var(--ink)}
.opt.picked .c{background:var(--ink);color:#fff}
.opt.dim{color:var(--muted)}
.opt.dim .c{color:var(--muted)}
.opt.right{background:var(--hl);border-color:var(--hl);color:var(--ink)}
.opt.right .c{background:var(--ink);color:#fff}
.opt.wrong{background:var(--ground);border-color:var(--line2);color:var(--ink2)}
.opt.wrong .c{background:var(--line);color:var(--ink2)}
.tag{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:600}
.tag.ok{background:var(--ink);color:#fff}
.tag.no{border:1.5px solid var(--faint);color:var(--ink2)}
.qz-side{flex:1 1 340px;display:flex;flex-direction:column;gap:20px;padding:28px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.qz-side .grow{flex:1;display:flex;flex-direction:column;gap:20px}
.qz-side .center{justify-content:center;gap:18px}
.qz-side p{margin:0;font-size:15px;line-height:1.65;color:var(--muted)}
.reveal{display:flex;align-items:center;justify-content:center;gap:10px;height:76px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:23px;font-weight:700;cursor:pointer}
.ans{display:flex;align-items:center;gap:16px}
.ans .n{flex:none;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--hl);font-family:var(--mono),var(--sans);font-size:28px;font-weight:600}
.ans small{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.ans b{display:block;font-size:20px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.ev small{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:var(--muted)}
.ev div{padding:14px 16px;border-radius:12px;background:var(--soft);font-size:17px;font-weight:500;line-height:1.6;white-space:pre-line}
.why{font-size:17px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.qz-nav{display:flex;gap:10px}
.qz-nav .btn{flex:1}
.qz-nav .btn.next{flex:1.4}

/* 수정 */
.badge{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--hl);font-size:13px;font-weight:600}
.ed-main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:32px 40px 40px}
.ed-quiz{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
.ed-list{flex:1 1 280px;display:flex;flex-direction:column;gap:10px}
.ed-list .lbl{padding:0 4px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.ed-item{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.ed-item .n{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--ground);font-family:var(--mono);font-size:16px;font-weight:600}
.ed-item .t{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-item[aria-pressed="true"]{border-color:var(--ink)}
.ed-item[aria-pressed="true"] .n{background:var(--ink);color:#fff}
.ed-form{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:22px;padding:30px 32px 32px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.ed-form.solo{max-width:980px;margin:0 auto;gap:24px;padding:32px 36px 36px}
.ed-form-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ed-form-head b{font-size:22px;font-weight:700;letter-spacing:-.015em}
.ed-form-head .tools{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:15px;font-weight:600}
.field>span em{font-style:normal;font-weight:500;color:var(--muted)}
.field>span i{font-style:normal;font-family:var(--mono);color:var(--muted)}
.inp{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:18px;line-height:1.55;resize:vertical}
input.inp{height:54px;padding:0 16px}

const idb = (() => {

class ApiError extends Error {}

  if (!res.ok) throw new ApiError('http_' + res.status);

  try { j = await res.json(); } catch (e) { throw new ApiError('not_json'); }

}
async function apiPost(body) {

    res = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  } catch (e) { throw new ApiError('network'); }

  try { return await res.json(); } catch (e) { throw new ApiError('not_json'); }

  if (m === 'forbidden') return '수업자료 폴더 밖의 파일입니다.';

}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const mem = new Map();
const fileCache = {
  async get(info) {
    const m = mem.get(info.id);
    if (m && m.updated >= (info.updated || 0)) return m.data;
    const c = await idb.get(info.id);
    if (c && c.updated >= (info.updated || 0)) { mem.set(info.id, c); return c.data; }
    return null;
  },
  put(id, updated, data) {
    const v = { updated: updated || 0, data };
    mem.set(id, v);
    idb.set(id, v);
  },
};
const inflight = new Map();
function getFile(info) {
  const key = info.id + ':' + info.updated;
  if (!inflight.has(key)) {
    const p = (async () => {
      const hit = await fileCache.get(info);
      if (hit) return hit;
      const j = await apiGet({ action: 'file', id: info.id });
      const f = j.file;
      const data = f.encoding === 'base64' ? { bytes: b64ToBytes(f.data) } : { text: f.data };
      fileCache.put(info.id, Math.max(f.updated || 0, info.updated || 0), data);
      return data;
    })().finally(() => inflight.delete(key));
    inflight.set(key, p);
  }
  return inflight.get(key);
}
function useFile(info) {
  const key = info ? info.id + ':' + info.updated : '';
  const [st, setSt] = useState({ key: '', status: 'none', data: null, error: null });
  useEffect(() => {
    if (!info) { setSt({ key, status: 'none', data: null, error: null }); return; }
    let alive = true;
    setSt({ key, status: 'loading', data: null, error: null });
    getFile(info).then(
      (data) => { if (alive) setSt({ key, status: 'ok', data, error: null }); },
      (error) => { if (alive) setSt({ key, status: 'error', data: null, error }); },
    );
    return () => { alive = false; };

  return st.key === key ? st : { key, status: info ? 'loading' : 'none', data: null, error: null };

function parsePassageName(name) {
  const m = name.match(/^\s*(\d+)(?:\s*[-~]\s*(\d+))?\s*번?\s*([^_]*?)\s*(?:_\s*(.*))?$/);
  if (m) return { num: Number(m[1]), numEnd: m[2] ? Number(m[2]) : null, numLabel: m[2] ? m[1] + '~' + m[2] : m[1], type: (m[3] || '').trim(), topic: (m[4] || '').trim() };
  const i = name.indexOf('_');
  return { num: null, numLabel: '', type: i > 0 ? name.slice(0, i).trim() : '', topic: i > 0 ? name.slice(i + 1).trim() : name };
}
function buildIndex(tree) {
  const byId = new Map();
  if (!tree) return { grades: [], byId, rootName: '수업자료' };
  const grades = (tree.grades || []).slice().sort(byName).map((g) => {
    const grade = { id: g.id, name: g.name, sets: [] };
    grade.sets = (g.sets || []).slice().sort((a, b) => byName(b, a)).map((s) => {
      const set = { id: s.id, name: s.name, grade, files: s.files || {}, passages: [], updated: 0 };
      Object.values(set.files).forEach((f) => { if (f && f.updated > set.updated) set.updated = f.updated; });
      set.passages = (s.passages || [])
        .map((p) => ({ id: p.id, name: p.name, files: p.files || {}, ...parsePassageName(p.name) }))
        .sort((a, b) => ((a.num ?? 1e9) - (b.num ?? 1e9)) || byName(a, b));
      set.passages.forEach((p, i) => {
        p.set = set;
        p.index = i;

        p.pdf = p.files.pdf || set.files.pdf || null;
        p.sharedPdf = !p.files.pdf && !!set.files.pdf;
        Object.values(p.files).forEach((f) => { if (f && f.updated > set.updated) set.updated = f.updated; });
        byId.set(p.id, p);
      });
      return set;
    });
    return grade;
  });
  return { grades, byId, rootName: tree.rootName || '수업자료' };

const circIndex = (s) => { const i = CIRC.indexOf(s); return i >= 0 ? i : (/^[1-5]$/.test(s) ? Number(s) - 1 : null); };
const EX_KEYS = [['summary', /요약/], ['topic', /주제/], ['flow', /흐름/], ['answer', /정답/], ['ev', /근거/], ['why', /풀이|해설/]];
function emptyExplain() { return { summary: '', topic: '', flow: '', answerNum: null, answerText: '', answerKo: '', ev: '', why: '' }; }
function parseExplain(text) {
  const out = emptyExplain();
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  let key = null, buf = [], fence = false;
  const flush = () => {
    if (!key) return;
    const t = buf.slice();
    while (t.length && !t[0].trim()) t.shift();
    while (t.length && !t[t.length - 1].trim()) t.pop();
    if (key === 'answer') {
      const ls = t.map((x) => x.trim()).filter(Boolean);
      if (ls.length) {
        const m = ls[0].match(/^([①②③④⑤]|[1-5])(?![0-9])[\s.)번]*(.*)$/);
        if (m) { out.answerNum = circIndex(m[1]); out.answerText = m[2].trim(); }
        else out.answerText = ls[0];
        out.answerKo = ls.slice(1).join('\n');

      out[key] = t.join('\n').trim();

    if (key) buf.push(line);
  }

}
function serializeExplain(e) {

    if ((m = line.match(/^([①②③④⑤])\s*(.*)$/))) { const i = CIRC.indexOf(m[1]); cur.opts[i] = m[2]; last = 'opt' + i; continue; }

    if ((m = line.match(/^(?:풀이|해설)\s*[:：]\s*(.*)$/))) { cur.why = m[1]; last = 'why'; continue; }

  const tidy = (s) => s.split('\n').map((x) => x.trim()).filter(Boolean).join('\n');

    const L = [(i + 1) + '. ' + q.text.replace(/\s*\n\s*/g, ' ').trim()];
    tidy(q.quote).split('\n').filter(Boolean).forEach((s) => L.push('> ' + s));

function ago(t) {

  if (s < 60) return '방금 전';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}

/* ───────── PDF 보기 ───────── */
function pageSpec(name) {
  const m = String(name || '').match(/(\d+)\s*(?:[-~–]\s*(\d+))?\s*쪽/);
  if (!m) return null;
  const a = Number(m[1]), b = m[2] ? Number(m[2]) : a;
  return [Math.min(a, b), Math.max(a, b)];
}
// 회차 PDF에서 문항 번호가 시작하는 쪽 찾기 ('22.' 또는 '[41~42]')
async function findPassagePage(pages, num) {
  const head = new RegExp('^\\s*\\[?\\s*' + num + '\\s*[.~～\\]]');
  const any = new RegExp('(^|\\s|\\[)' + num + '\\s*[.~～]\\s');
  const texts = [];
  for (let i = 0; i < pages.length; i++) {
    let items = [];
    try { items = (await pages[i].pg.getTextContent()).items || []; } catch (e) {}
    if (items.some((it) => head.test(it.str || ''))) return i;
    texts.push(items.map((it) => it.str || '').join(' '));
  }
  return texts.findIndex((t) => any.test(t));
}
const ZOOMS = [50, 75, 100, 125, 150, 200, 300, 400];
const MIN_S = 0.3 * PT2PX, MAX_S = 5 * PT2PX;
const PAD = { x: 32, top: 32, bottom: 132 };

function PageCanvas({ page, w, h, scale }) {
  const ref = useRef(null);
  const drawn = useRef(false);
  const cssW = Math.round(w * scale), cssH = Math.round(h * scale);
  useEffect(() => {
    let task = null, dead = false;
    const timer = setTimeout(async () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      let rs = scale * dpr;
      const maxPx = 16e6;
      if (w * rs * h * rs > maxPx) rs = Math.sqrt(maxPx / (w * h));
      const vp = page.getViewport({ scale: rs });
      const off = document.createElement('canvas');
      off.width = Math.floor(vp.width);
      off.height = Math.floor(vp.height);
      task = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
      try { await task.promise; } catch (e) { return; }
      if (dead || !ref.current) return;
      const c = ref.current;
      c.width = off.width; c.height = off.height;
      c.getContext('2d').drawImage(off, 0, 0);
      drawn.current = true;
    }, drawn.current ? 160 : 0);
    return () => { dead = true; clearTimeout(timer); if (task) { try { task.cancel(); } catch (e) {} } };
  }, [page, scale]);
  return <div className="pdf-page" style={{ width: cssW, height: cssH }}><canvas ref={ref} /></div>;
}

function PdfView({ info, findNum, visual, panel, setPanel }) {
  const file = useFile(info);
  const [pages, setPages] = useState(null);
  const [err, setErr] = useState(null);
  const [view, setView] = useState(() => ({ mode: panel ? 'page' : local.get('pdfMode', 'width'), pct: 100 }));
  const [box, setBox] = useState({ w: 0, h: 0 });
  const [hint, setHint] = useState(true);
  const scrollRef = useRef(null), stackRef = useRef(null);
  const anchorRef = useRef(null), resetRef = useRef(false), savedRef = useRef(null);
  const [jump, setJump] = useState(-1);
  const [curPage, setCurPage] = useState(0);
  const curPageRef = useRef(0); curPageRef.current = curPage;
  const jumped = useRef(false);

  // PDF 열기
  useEffect(() => {
    if (file.status !== 'ok') return;
    let task = null, alive = true;
    (async () => {
      try {
        task = pdfjsLib.getDocument({ data: file.data.bytes.slice() });
        const doc = await task.promise;
        const ps = [];
        // 파일 이름에 '1쪽', '2-3쪽'이 있으면 그 쪽만 보여 줌
        const spec = pageSpec(info && info.name);
        const from = spec ? clamp(spec[0], 1, doc.numPages) : 1;
        const to = spec ? clamp(spec[1], from, doc.numPages) : doc.numPages;
        for (let i = from; i <= to; i++) {
          const pg = await doc.getPage(i);
          const vp = pg.getViewport({ scale: 1 });
          ps.push({ pg, n: i, w: vp.width, h: vp.height });
        }
        if (alive) setPages(ps);
        if (findNum != null && ps.length > 1) {
          const idx = await findPassagePage(ps, findNum);
          if (alive && idx > 0) setJump(idx);
        }
      } catch (e) { if (alive) setErr(e); }
    })();
    return () => { alive = false; if (task) task.destroy(); };
  }, [file.status, file.data]);

  // 화면 크기
  useLayoutEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const measure = () => setBox({ w: el.clientWidth, h: el.clientHeight });
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // 회차 PDF면 그 지문이 있는 쪽으로 처음 한 번 이동
  useLayoutEffect(() => {
    if (jump < 0 || jumped.current || !stackRef.current || !box.w) return;
    const el = stackRef.current.children[jump];
    const sc = scrollRef.current;
    if (!el || !sc) return;
    jumped.current = true;
    sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 16;
    setCurPage(jump);
  }, [jump, pages, box.w]);

  // 지금 보고 있는 쪽
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const st = stackRef.current;
        if (!st) return;
        const line = sc.getBoundingClientRect().top + sc.clientHeight * 0.35;
        let idx = 0;
        Array.from(st.children).forEach((c, i) => { if (c.getBoundingClientRect().top <= line) idx = i; });
        setCurPage(idx);
      });
    };
    sc.addEventListener('scroll', onScroll, { passive: true });
    return () => { sc.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);

  // 안내 문구는 잠깐만
  useEffect(() => { const t = setTimeout(() => setHint(false), 6000); return () => clearTimeout(t); }, []);

  // 설명 자료를 열면 쪽 맞춤, 닫으면 원래대로
  const firstPanel = useRef(true);
  const viewRef = useRef(view); viewRef.current = view;
  useEffect(() => {
    if (firstPanel.current) { firstPanel.current = false; return; }
    resetRef.current = true;
    if (panel) { savedRef.current = viewRef.current; setView({ mode: 'page', pct: 100 }); }
    else setView(savedRef.current && savedRef.current.mode !== 'page' ? savedRef.current : { mode: local.get('pdfMode', 'width'), pct: 100 });
  }, [panel]);

  const maxW = pages ? Math.max(...pages.map((x) => x.w)) : 595;
  const firstH = pages ? pages[0].h : 842;
  const fitW = Math.max(100, box.w - PAD.x * 2) / maxW;
  const fitP = Math.min(Math.max(100, box.h - PAD.top - PAD.bottom) / firstH, fitW);
  const scale = clamp(view.mode === 'width' ? fitW : view.mode === 'page' ? fitP : (view.pct / 100) * PT2PX, MIN_S, MAX_S);
  const pct = Math.round((scale / PT2PX) * 100);
  const scaleRef = useRef(scale); scaleRef.current = scale;
  const fitRef = useRef({ fitW, fitP }); fitRef.current = { fitW, fitP };

  const applyAnchor = () => {
    const sc = scrollRef.current, st = stackRef.current;
    if (!sc || !st) return;
    if (resetRef.current) {
      resetRef.current = false;
      st.style.transform = '';
      anchorRef.current = null;
      sc.scrollLeft = 0;
      const el = st.children[curPageRef.current] || st.children[0];
      sc.scrollTop = el ? sc.scrollTop + el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 16 : 0;
      return;
    }
    const a = anchorRef.current;
    if (!a) return;
    anchorRef.current = null;
    st.style.transform = '';
    const r = st.getBoundingClientRect();
    const s = scaleRef.current;
    sc.scrollLeft += r.left + a.px * s - a.cx;
    sc.scrollTop += r.top + a.py * s - a.cy;
  };
  useLayoutEffect(applyAnchor, [scale]);

  const center = () => {
    const r = scrollRef.current.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + Math.min(r.height / 2, 320) };
  };
  const setAnchor = (cx, cy) => {
    const st = stackRef.current;
    if (!st) return;
    const r = st.getBoundingClientRect();
    const s = scaleRef.current;
    anchorRef.current = { px: (cx - r.left) / s, py: (cy - r.top) / s, cx, cy };
  };
  const commit = (next) => {
    setView(next);
    requestAnimationFrame(() => { if (anchorRef.current || resetRef.current) applyAnchor(); });
  };
  const zoomAt = (target, cx, cy) => {
    if (!stackRef.current) return;
    if (cx == null) { const c = center(); cx = c.x; cy = c.y; }
    setAnchor(cx, cy);
    commit({ mode: 'zoom', pct: Math.round((clamp(target, MIN_S, MAX_S) / PT2PX) * 100) });
    setHint(false);
  };
  const stepZoom = (dir) => {
    const next = dir > 0 ? (ZOOMS.find((l) => l > pct + 1) ?? ZOOMS[ZOOMS.length - 1]) : ([...ZOOMS].reverse().find((l) => l < pct - 1) ?? ZOOMS[0]);
    zoomAt((next / 100) * PT2PX);
  };
  const fitMode = (mode) => {
    if (!stackRef.current) return;
    if (mode === 'page') resetRef.current = true;
    else { const c = center(); setAnchor(c.x, c.y); }
    if (!panel) local.set('pdfMode', mode);
    commit({ mode, pct: 100 });
  };
  const doubleTap = (cx, cy) => {
    const s = scaleRef.current;
    const base = panel ? fitRef.current.fitP : fitRef.current.fitW;
    if (s > base * 1.15) { setAnchor(cx, cy); commit({ mode: panel ? 'page' : 'width', pct: 100 }); }
    else zoomAt(s * 2, cx, cy);
  };

  // 터치: 한 손가락은 스크롤, 두 손가락은 확대·축소, 두 번 탭은 확대/원래대로
  const fns = useRef({});
  fns.current = { zoomAt, doubleTap, setAnchor, commit };
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    let pinch = null, tap = null, lastTap = null;
    const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    const mid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
    const start = (e) => {
      const st = stackRef.current;
      if (e.touches.length === 2 && st) {
        e.preventDefault();
        const m = mid(e.touches);
        const r = st.getBoundingClientRect();
        const s = scaleRef.current;
        pinch = { d0: dist(e.touches), m0: m, m1: m, k: 1, s0: s, px: (m.x - r.left) / s, py: (m.y - r.top) / s, ox: m.x - r.left, oy: m.y - r.top };
        st.style.transformOrigin = pinch.ox + 'px ' + pinch.oy + 'px';
        tap = null;
        setHint(false);
      } else if (e.touches.length === 1) {
        tap = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
      } else tap = null;
    };
    const move = (e) => {
      if (pinch && e.touches.length >= 2) {
        e.preventDefault();
        const m = mid(e.touches);
        const k = clamp(pinch.s0 * (dist(e.touches) / pinch.d0), MIN_S, MAX_S) / pinch.s0;
        pinch.k = k; pinch.m1 = m;
        stackRef.current.style.transform = 'translate(' + (m.x - pinch.m0.x) + 'px,' + (m.y - pinch.m0.y) + 'px) scale(' + k + ')';
      } else if (tap && e.touches.length === 1) {
        const t = e.touches[0];
        if (Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 12) tap = null;
      }
    };
    const end = (e) => {
      if (pinch) {
        if (e.touches.length < 2) {
          const p = pinch;
          pinch = null;
          anchorRef.current = { px: p.px, py: p.py, cx: p.m1.x, cy: p.m1.y };
          fns.current.commit({ mode: 'zoom', pct: Math.round(((p.s0 * p.k) / PT2PX) * 100) });
          tap = null;
          lastTap = null;
        }
        return;
      }
      if (tap && e.touches.length === 0 && Date.now() - tap.t < 300) {
        const now = Date.now();
        if (lastTap && now - lastTap.t < 340 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 40) {
          e.preventDefault();
          fns.current.doubleTap(tap.x, tap.y);
          lastTap = null;
        } else lastTap = { x: tap.x, y: tap.y, t: now };
      }
      tap = null;
    };
    const wheel = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      fns.current.zoomAt(scaleRef.current * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
    };
    sc.addEventListener('touchstart', start, { passive: false });
    sc.addEventListener('touchmove', move, { passive: false });
    sc.addEventListener('touchend', end, { passive: false });
    sc.addEventListener('touchcancel', end, { passive: false });
    sc.addEventListener('wheel', wheel, { passive: false });
    return () => {
      sc.removeEventListener('touchstart', start);
      sc.removeEventListener('touchmove', move);
      sc.removeEventListener('touchend', end);
      sc.removeEventListener('touchcancel', end);
      sc.removeEventListener('wheel', wheel);
    };
  }, []);

  const failed = err || file.status === 'error';
  return (
    <div className="stage">
      <div className={'pdf-area' + (panel ? ' with-panel' : '')}>
        <div className="pdf-scroll" ref={scrollRef} onDoubleClick={(e) => doubleTap(e.clientX, e.clientY)}>
          <div className="pdf-sheet">
            {pages && box.w > 0 && (
              <div className="pdf-stack" ref={stackRef}>
                {pages.map((x, i) => <PageCanvas key={i} page={x.pg} w={x.w} h={x.h} scale={scale} />)}
              </div>
            )}
          </div>
        </div>
        {!pages && !failed && <Loading text="지문을 불러오는 중" />}
        {failed && <Problem title="지문 PDF를 열지 못했습니다" error={file.error || err} onRetry={() => location.reload()} />}
        {pages && !panel && (
          <div className={'hint' + (hint ? '' : ' gone')} aria-hidden={!hint}>
            <Icon name="pinch" size={18} />두 손가락으로 확대·축소 · 두 번 탭하면 확대
          </div>
        )}
        {pages && (
          <div className="dock">
            <button type="button" aria-label="축소" onClick={() => stepZoom(-1)}><Icon name="minus" size={24} stroke={2.2} /></button>
            <div className="pct" aria-live="polite">{pct}%</div>
            <button type="button" aria-label="확대" onClick={() => stepZoom(1)}><Icon name="plus" size={24} stroke={2.2} /></button>
            <div className="sep" aria-hidden="true" />
            <button type="button" className={panel ? '' : 'wide'} aria-label="폭 맞춤" aria-pressed={view.mode === 'width'} onClick={() => fitMode('width')}>
              <Icon name="fitW" />{!panel && <span>폭 맞춤</span>}
            </button>
            <button type="button" className={panel ? '' : 'wide'} aria-label="쪽 맞춤" aria-pressed={view.mode === 'page'} onClick={() => fitMode('page')}>
              <Icon name="fitP" />{!panel && <span>쪽 맞춤</span>}
            </button>
            {!panel && <><div className="sep" aria-hidden="true" /><div className="pages">{pages.length > 1 ? (pages[curPage] || pages[0]).n + ' / ' + pages[pages.length - 1].n : pages[0].n}쪽</div></>}
          </div>
        )}
      </div>
      {panel && visual && <VisualPanel info={visual} onClose={() => setPanel(false)} />}
    </div>
  );
}

/* ───────── 형성평가 ───────── */
function QuizView({ info }) {
  const f = useFile(info);
  const qs = useMemo(() => (f.status === 'ok' ? parseQuiz(f.data.text).filter((q) => q.text || q.opts.some(Boolean)) : []), [f.data]);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(-1);
  const [revealed, setRevealed] = useState(false);

  if (f.status === 'loading') return <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}><Loading text="형성평가를 불러오는 중" /></div>;
  if (f.status === 'error') return <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}><Problem title="형성평가를 열지 못했습니다" error={f.error} /></div>;
  if (!qs.length) return <div className="stage" style={{ position: 'relative', background: 'var(--ground)' }}><Problem title="형성평가 문항을 읽지 못했습니다" /></div>;

  const i = Math.min(idx, qs.length - 1);
  const q = qs[i];
  const last = i === qs.length - 1;
  const go = (n) => { setIdx(n); setPicked(-1); setRevealed(false); };

  return (
    <div className="scroll" style={{ display: 'flex', flexDirection: 'column' }}>
      <main className="qz-main">
        <section className="qz-left" aria-label="문제">
          <div className="qz-prog">
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
              <span className="lbl">QUESTION</span>
              <span className="num">{i + 1} <span>/ {qs.length}</span></span>
            </div>
            <div className="segs" aria-hidden="true">
              {qs.map((_, k) => <i key={k} className={k < i ? 'done' : k === i ? 'cur' : ''} />)}
            </div>
          </div>
          <h1 className="qz-q">{q.text}</h1>
          {q.quote && <div className="qz-quote">{q.quote}</div>}
          <div className="opts">
            {q.opts.map((t, k) => {
              if (!t) return null;
              const isPicked = picked === k;
              const right = revealed && k === q.a;
              const wrong = revealed && isPicked && k !== q.a;
              const cls = 'opt' + (right ? ' right' : wrong ? ' wrong' : revealed ? ' dim' : isPicked ? ' picked' : '');
              return (
                <button key={k} type="button" className={cls} aria-pressed={isPicked} onClick={() => { if (!revealed) setPicked(isPicked ? -1 : k); }}>
                  <span className="c">{CIRC[k]}</span>
                  <span className="t">{t}</span>
                  {right && <span className="tag ok"><Icon name="check" size={16} stroke={2.8} />정답</span>}
                  {wrong && <span className="tag no"><Icon name="x" size={15} stroke={2.6} />선택</span>}
                </button>
              );
            })}
          </div>
        </section>

        <aside className="qz-side">
          {!revealed ? (
            <div className="grow center">
              <p>보기를 누르면 선택 표시만 됩니다.<br />학생들의 답을 들은 뒤 정답을 공개하세요.</p>
              <button type="button" className="reveal" onClick={() => setRevealed(true)}><Icon name="eye" size={24} />정답 보기</button>
            </div>
          ) : (
            <div className="grow">
              {q.a != null ? (
                <div className="ans">
                  <div className="n">{CIRC[q.a]}</div>
                  <div><small>정답</small><b>{q.opts[q.a]}</b></div>
                </div>
              ) : <p>이 문항에는 정답이 지정되지 않았습니다.</p>}
              {q.ev && <div className="ev"><small>지문 근거</small><div lang="en">{q.ev}</div></div>}
              {q.why && <div className="why">{q.why}</div>}
            </div>
          )}
          <div className="qz-nav">
            <button type="button" className="btn big" disabled={i === 0} onClick={() => go(i - 1)}><Icon name="back" stroke={2.2} />이전</button>
            <button type="button" className={'btn big next' + (revealed ? ' primary' : '')} onClick={() => go(last ? 0 : i + 1)}>{last ? '처음으로' : '다음 문제'}<Icon name="next" stroke={2.2} /></button>
          </div>
        </aside>
      </main>
    </div>
  );
}

function Editor({ p, which, onSaved }) {
  const [pw, setPw] = useState(() => sess.get('pw'));
  const [tab, setTab] = useState(which);
  const exFile = useFile(p.files.explain);
  const qzFile = useFile(p.files.quiz);
  const [ex, setEx] = useState(null);
  const [qs, setQs] = useState(null);
  const [sel, setSel] = useState(0);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);
  const [leaving, setLeaving] = useState(false);
  const orig = useRef({ ex: null, qs: null });

  useEffect(() => {
    if (ex) return;
    if (!p.files.explain) { const e = emptyExplain(); orig.current.ex = serializeExplain(e); setEx(e); }
    else if (exFile.status === 'ok') { const e = parseExplain(exFile.data.text); orig.current.ex = serializeExplain(e); setEx(e); }
  }, [exFile.status]);
  useEffect(() => {
    if (qs) return;
    if (!p.files.quiz) { const q = [blankQuestion()]; orig.current.qs = serializeQuiz(q); setQs(q); }
    else if (qzFile.status === 'ok') {
      let q = parseQuiz(qzFile.data.text);
      if (!q.length) q = [blankQuestion()];
      orig.current.qs = serializeQuiz(q);
      setQs(q);
    }
  }, [qzFile.status]);

  const dirtyEx = !!ex && serializeExplain(ex) !== orig.current.ex;
  const dirtyQz = !!qs && serializeQuiz(qs) !== orig.current.qs;
  const back = () => nav('p/' + enc(p.id) + '/' + tab, true);
  const tryLeave = () => { if (dirtyEx || dirtyQz) setLeaving(true); else back(); };

  const save = async () => {
    const jobs = [];
    if (dirtyEx) jobs.push(['explain', serializeExplain(ex), 'ex']);
    if (dirtyQz) jobs.push(['quiz', serializeQuiz(qs), 'qs']);
    if (!jobs.length) { setMsg({ kind: '', text: '바뀐 내용이 없습니다.' }); return; }
    setSaving(true); setMsg(null);
    let created = false;
    try {
      for (const [kind, content, key] of jobs) {
        const r = await apiPost({ action: 'save', password: pw, folderId: p.id, kind, content });
        if (!r.ok) throw new ApiError(r.error || 'error');
        fileCache.put(r.file.id, r.file.updated, { text: content });
        onSaved(p.id, kind, r.file);
        orig.current[key] = content;
        if (r.created) created = true;
      }
      setMsg({ kind: 'ok', text: created ? '저장했습니다. 드라이브에 새 파일을 만들었습니다.' : '저장했습니다. 고치기 전 내용은 드라이브의 ‘_이전’ 폴더에 보관했습니다.' });
    } catch (e) {
      if (e.message === 'password') { sess.set('pw', null); setPw(null); }
      setMsg({ kind: 'bad', text: '저장하지 못했습니다. ' + errorText(e) });
    }
    setSaving(false);
  };

  const loading = !ex || !qs;
  const q = qs ? qs[Math.min(sel, qs.length - 1)] : null;
  const si = qs ? Math.min(sel, qs.length - 1) : 0;
  const setQ = (patch) => setQs(qs.map((x, j) => (j === si ? { ...x, ...patch } : x)));
  const swap = (a, b) => { if (b < 0 || b >= qs.length) return; const n = qs.slice(); [n[a], n[b]] = [n[b], n[a]]; setQs(n); setSel(b); };
  const exField = (k) => ({ value: ex[k], onChange: (e) => setEx({ ...ex, [k]: e.target.value }) });

  return (
    <div className="app">
      <header className="topbar">
        <div className="side">
          <button type="button" className="sq-btn" aria-label="수정을 마치고 돌아가기" onClick={tryLeave}><Icon name="back" size={22} stroke={2.2} /></button>
          <div className="pnames">
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-.015em', whiteSpace: 'nowrap' }}>{p.numLabel ? p.numLabel + '번 ' : ''}자료 수정</div>
              <span className="badge"><Icon name="unlock" size={14} stroke={2.2} />선생님 모드</span>
            </div>
            <div className="psub">{p.set.name}{p.type ? ' · ' + p.type : ''}</div>
          </div>
        </div>
        <div className="seg" role="group" aria-label="수정할 자료">
          <button type="button" className="seg-btn" aria-pressed={tab === 'explain'} onClick={() => setTab('explain')}>해설{dirtyEx ? ' •' : ''}</button>
          <button type="button" className="seg-btn" aria-pressed={tab === 'quiz'} onClick={() => setTab('quiz')}>형성평가{dirtyQz ? ' •' : ''}</button>
        </div>
        <div className="side end">
          <button type="button" className="btn" onClick={tryLeave} style={{ padding: '0 22px', fontSize: 17 }}>취소</button>
          <button type="button" className="btn primary" onClick={save} disabled={saving || loading || !pw} style={{ padding: '0 26px 0 20px', fontSize: 17 }}>
            <Icon name={saving ? 'refresh' : 'check'} size={19} stroke={2.4} className={saving ? 'spin' : ''} />{saving ? '저장 중…' : '저장'}
          </button>
        </div>
      </header>

      <div className="scroll">
        {loading && <div style={{ position: 'relative', height: 300 }}><Loading text="자료를 불러오는 중" /></div>}

        {!loading && tab === 'explain' && (
          <main className="ed-main">
            <section className="ed-form solo" aria-label="해설 편집">
              <label className="field"><span><i>01</i> 한 줄 요약 <em>· 한국어</em></span><textarea className="inp" rows={2} {...exField('summary')} /></label>
              <label className="field"><span><i>02</i> 주제문 <em>· 영어</em></span><textarea className="inp" rows={2} lang="en" {...exField('topic')} /></label>
              <label className="field"><span><i>03</i> 글의 흐름 <em>· 칸이 맞도록 고정폭 글꼴로 표시됩니다</em></span><textarea className="inp code" rows={13} wrap="off" spellCheck={false} {...exField('flow')} /></label>
              <div className="field">
                <span><i>04</i> 정답</span>
                <div role="group" aria-label="정답 번호" style={{ display: 'flex', gap: 10 }}>
                  {CIRC.map((c, k) => <button key={k} type="button" className="circ lg" aria-pressed={ex.answerNum === k} onClick={() => setEx({ ...ex, answerNum: ex.answerNum === k ? null : k })}>{c}</button>)}
                </div>
              </div>
              <label className="field"><span>정답 보기 <em>· 보기 내용 그대로</em></span><input className="inp" type="text" lang="en" {...exField('answerText')} /></label>
              <label className="field"><span>정답 보기 해석</span><input className="inp" type="text" {...exField('answerKo')} /></label>
              <label className="field"><span>근거 문장</span><textarea className="inp" rows={3} lang="en" style={{ fontSize: 17 }} {...exField('ev')} /></label>
              <label className="field"><span>풀이</span><textarea className="inp" rows={3} style={{ fontSize: 17 }} {...exField('why')} /></label>
            </section>
          </main>
        )}

        {!loading && tab === 'quiz' && q && (
          <main className="ed-main">
            <div className="ed-quiz">
              <div className="ed-list">
                <div className="lbl">문항 {qs.length}개</div>
                {qs.map((x, k) => (
                  <button key={k} type="button" className="ed-item" aria-pressed={k === si} onClick={() => setSel(k)}>
                    <span className="n">{k + 1}</span>
                    <span className="t">{x.text || '(새 문항)'}</span>
                  </button>
                ))}
                <button type="button" className="btn ghost" style={{ height: 60, borderRadius: 16 }} onClick={() => { setQs([...qs, blankQuestion()]); setSel(qs.length); }}>
                  <Icon name="plus" size={18} stroke={2.2} />문항 추가
                </button>
              </div>
              <section className="ed-form" aria-label="문항 편집">
                <div className="ed-form-head">
                  <b>문항 {si + 1}</b>
                  <div className="tools">
                    <button type="button" className="sq-btn sm" aria-label="위로 옮기기" disabled={si === 0} onClick={() => swap(si, si - 1)}><Icon name="up" stroke={2.2} /></button>
                    <button type="button" className="sq-btn sm" aria-label="아래로 옮기기" disabled={si === qs.length - 1} onClick={() => swap(si, si + 1)}><Icon name="down" stroke={2.2} /></button>
                    <button type="button" className="btn" style={{ height: 48, borderRadius: 12, fontSize: 15, color: 'var(--ink2)' }} disabled={qs.length < 2} onClick={() => { setQs(qs.filter((_, j) => j !== si)); setSel(Math.max(0, si - 1)); }}>
                      <Icon name="trash" size={18} />문항 삭제
                    </button>
                  </div>
                </div>
                <label className="field"><span>문제</span><textarea className="inp" rows={2} value={q.text} onChange={(e) => setQ({ text: e.target.value })} /></label>
                <label className="field"><span>제시문 <em>· 없으면 비워 두세요</em></span><input className="inp" type="text" placeholder="예: 밑줄 친 문장이나 빈칸 문장" value={q.quote} onChange={(e) => setQ({ quote: e.target.value })} /></label>
                <div className="field">
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 15, fontWeight: 600 }}>보기</span>
                    <span style={{ fontSize: 14, color: 'var(--muted)' }}>번호를 누르면 정답으로 지정됩니다</span>
                  </div>
                  {q.opts.map((o, k) => (
                    <div className="ed-opt" key={k}>
                      <button type="button" className="circ" aria-label={CIRC[k] + '번을 정답으로'} aria-pressed={q.a === k} onClick={() => setQ({ a: q.a === k ? null : k })}>{CIRC[k]}</button>
                      <input className="inp" type="text" aria-label={'보기 ' + CIRC[k]} value={o} style={{ borderColor: q.a === k ? 'var(--ink)' : undefined }} onChange={(e) => setQ({ opts: q.opts.map((x, j) => (j === k ? e.target.value : x)) })} />
                      {q.a === k && <b>정답</b>}
                    </div>
                  ))}
                </div>
                <label className="field"><span>지문 근거</span><textarea className="inp" rows={2} lang="en" style={{ fontSize: 17 }} value={q.ev} onChange={(e) => setQ({ ev: e.target.value })} /></label>
                <label className="field"><span>풀이</span><textarea className="inp" rows={2} style={{ fontSize: 17 }} value={q.why} onChange={(e) => setQ({ why: e.target.value })} /></label>
              </section>
            </div>
          </main>
        )}
      </div>

      <footer className={'ed-foot' + (msg && msg.kind ? ' ' + msg.kind : '')} role="status">
        <Icon name={msg && msg.kind === 'ok' ? 'check' : msg && msg.kind === 'bad' ? 'alert' : 'folder'} size={18} stroke={msg && msg.kind === 'ok' ? 2.6 : 2} />
        <span>{msg ? msg.text : '저장하면 드라이브의 파일이 바뀌고, 고치기 전 내용은 ‘_이전’ 폴더에 보관됩니다.'}</span>
      </footer>

      {!pw && <AuthModal onOk={(v) => { setPw(v); setMsg(null); }} onCancel={back} />}
      {leaving && <ConfirmModal text="고친 내용을 저장하지 않고 나가면 사라집니다." ok="저장하지 않고 나가기" cancel="계속 고치기" onOk={back} onCancel={() => setLeaving(false)} />}
    </div>
  );
}

/* ───────── 앱 ───────── */
function Setup() {
  return (
    <div className="scroll">
      <div className="setup">
        <h1>처음 설정이 필요합니다</h1>
        <p><code>config.js</code> 파일의 <code>API_URL</code>에 Apps Script 웹 앱 주소가 비어 있습니다.</p>
        <ol>
          <li>Apps Script에 <code>Code.gs</code>를 붙여넣고 수업자료 폴더 ID와 비밀번호를 채웁니다.</li>
          <li>배포 › 새 배포 › 웹 앱 (실행: 나, 액세스: 모든 사용자)으로 배포합니다.</li>
          <li>받은 주소(…/exec)를 <code>config.js</code>의 <code>API_URL</code>에 붙여넣고 깃허브에 올립니다.</li>
        </ol>
      </div>
    </div>
  );
}

function App() {
  const [route, setRoute] = useState(parseRoute);
  useEffect(() => {
    const f = () => setRoute(parseRoute());
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);
  const [tree, setTree] = useState(() => local.get('tree', null));
  const [sync, setSync] = useState(() => ({ state: tree ? 'stale' : 'loading', time: local.get('treeTime', 0), error: null }));
  const load = useCallback(async (fresh) => {
    setSync((s) => ({ ...s, state: s.time ? 'refreshing' : 'loading', error: null }));
    try {
      const j = await apiGet({ action: 'tree', fresh: fresh ? '1' : '' });
      const now = Date.now();
      setTree(j.tree);
      local.set('tree', j.tree);
      local.set('treeTime', now);
      setSync({ state: 'ok', time: now, error: null });
    } catch (e) {
      setSync((s) => ({ ...s, state: 'error', error: e }));
    }
  }, []);
  useEffect(() => { if (CFG.API_URL) load(false); }, []);
  const [, tick] = useState(0);
  useEffect(() => { const t = setInterval(() => tick((x) => x + 1), 30000); return () => clearInterval(t); }, []);
  const index = useMemo(() => buildIndex(tree), [tree]);
  const onSaved = useCallback((pid, kind, file) => {
    setTree((t) => {
      const nt = JSON.parse(JSON.stringify(t));
      nt.grades.forEach((g) => g.sets.forEach((s) => s.passages.forEach((x) => { if (x.id === pid) x.files = { ...(x.files || {}), [kind]: file }; })));
      local.set('tree', nt);
      return nt;
    });
  }, []);

  if (!CFG.API_URL) return <Setup />;
  if (!tree) {
    if (sync.state === 'error') return <div className="app" style={{ position: 'relative' }}><Problem title="드라이브에 연결하지 못했습니다" error={sync.error} onRetry={() => load(true)} /></div>;
    return <div className="app" style={{ position: 'relative' }}><Loading text="수업자료 목록을 불러오는 중" /></div>;
  }
  if (route.view === 'passage' || route.view === 'edit') {
    const p = index.byId.get(route.id);
    if (!p) {
      if (sync.state !== 'ok' && sync.state !== 'error') return <div className="app" style={{ position: 'relative' }}><Loading text="지문을 찾는 중" /></div>;
      return (
        <div className="app" style={{ position: 'relative' }}>
          <div className="center-msg">
            <Icon name="alert" size={30} /><b>이 지문을 찾지 못했습니다</b>
            <small>드라이브에서 폴더가 옮겨졌거나 지워졌을 수 있습니다.</small>
            <a className="btn" href="#/">목록으로</a>
          </div>
        </div>
      );
    }
    if (route.view === 'edit') return <Editor key={p.id} p={p} which={route.which} onSaved={onSaved} />;
    return <Passage p={p} route={route} />;
  }
  return <Home index={index} route={route} sync={sync} onRefresh={() => load(true)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
